# dcdash example configuration.
# Default location: /etc/dcdash/config.yaml (override with --config or DCDASH_CONFIG).
# Keep this file readable for the dcdash user only (chmod 0640).
#
# Secret values (passwords, tokens, keys) can be given as
#   "env:NAME"    -> value of the environment variable NAME
#   "file:/path"  -> content of the file
# or literally.

server:
  # Address and port to listen on.
  listen: ":8443"
  # Optional plain HTTP listener that redirects to HTTPS, e.g. ":80". Empty disables it.
  redirect_listen: ""
  # max-age of the Strict-Transport-Security header (0 disables it).
  hsts_max_age: 4320h
  # Reverse proxies (IPs or CIDR ranges) whose X-Forwarded-For header is trusted
  # to determine the client IP address (used for logging and login lockout).
  trusted_proxies: []
  read_header_timeout: 10s
  shutdown_timeout: 15s

  # See docs/certificates.md for all options and examples.
  tls:
    # acme:  request and renew the certificate from an ACME CA (Let's Encrypt, step-ca, ...).
    # files: certificate and key from PEM files, reloaded when they change.
    # none:  plain HTTP; only for development or behind a TLS-terminating proxy.
    mode: files
    cert_file: /etc/dcdash/tls/cert.pem
    key_file: /etc/dcdash/tls/key.pem
    # How often the files are checked for changes; 0 disables reloading.
    reload_interval: 1m

    # Used with mode: acme.
    acme:
      directory_url: https://acme-v02.api.letsencrypt.org/directory
      email: ""
      # Must be true: accepts the terms of service of the CA.
      accept_tos: false
      domains: []
      key_type: EC256
      # Additional trusted root for the ACME server (e.g. the step-ca root).
      ca_file: ""
      renew_before: 720h
      # External account binding, if the CA requires it.
      eab:
        key_id: ""
        hmac_key: ""
      dns:
        # cloudflare or rfc2136
        provider: cloudflare
        cloudflare:
          # e.g. "file:/etc/dcdash/cloudflare-acme.token" or "env:CLOUDFLARE_ACME_TOKEN"
          api_token: ""
        rfc2136:
          nameserver: ""
          tsig_key: ""
          tsig_secret: ""
          tsig_algorithm: hmac-sha256
        # Resolvers for zone lookup and propagation checks (default: system resolvers).
        resolvers: []
        # 0: provider default.
        propagation_timeout: 0s
        disable_authoritative_check: false

auth:
  ldap:
    # ldaps://host:636, or ldap://host:389 with start_tls: true. Empty disables LDAP login.
    url: ldaps://dc1.example.com:636
    start_tls: false
    tls:
      # Additional trusted root certificates (PEM).
      ca_file: ""
      # Pin the server certificate instead (SHA-256, e.g. for Samba's autogenerated
      # certificate): openssl s_client -connect dc1.example.com:636 </dev/null |
      #   openssl x509 -noout -fingerprint -sha256
      fingerprint: ""
      server_name: ""
    # ad (Active Directory, Samba AD) or generic (e.g. OpenLDAP)
    mode: ad
    # Service account used to search users and groups (read access is enough).
    bind_dn: dcdash-svc@example.com
    bind_password: "file:/etc/dcdash/ldap-bind.password"
    base_dn: DC=example,DC=com
    # Defaults depend on the mode; {username} is the escaped login name.
    # user_filter: "(&(objectCategory=person)(objectClass=user)(|(sAMAccountName={username})(userPrincipalName={username})))"
    # group_base_dn: ""   # default: base_dn
    # group_filter: ""    # generic mode only, e.g. "(&(objectClass=groupOfNames)(member={dn}))"
    timeout: 10s
  session:
    # Maximum session duration and inactivity timeout.
    lifetime: 8h
    idle_timeout: 30m
  lockout:
    # Failed logins before a user name or client IP address is locked.
    user: {max_failures: 5, window: 15m, duration: 15m}
    ip: {max_failures: 20, window: 15m, duration: 15m}

security:
  # Key (base64, 32 bytes) for secrets stored in the database, e.g. TOTP seeds.
  # Generate one with `dcdash gen-key`. Keep it outside this file, e.g. "file:/etc/dcdash/encryption.key".
  # Losing the key makes the stored secrets unreadable (users must enroll TOTP again).
  encryption_key: "file:/etc/dcdash/encryption.key"
  # After changing the key, list the old one here until all data is re-encrypted
  # (see docs/security.md).
  previous_encryption_keys: []

log:
  # trace, debug, info, warn, error
  level: info
  # json or console
  format: json

# Directory for persistent state (database, ACME account and certificates).
data_dir: /var/lib/dcdash
