# dcdash example configuration.
# Default location: /etc/dcdash/config.yaml (override with --config or DCDASH_CONFIG).
# Keep this file readable for the dcdash user only (chmod 0640).
#
# Secret values (passwords, tokens, keys) can be given as
#   "env:NAME"    -> value of the environment variable NAME
#   "file:/path"  -> content of the file
# or literally.

server:
  # Address and port to listen on.
  listen: ":8443"
  # Optional plain HTTP listener that redirects to HTTPS, e.g. ":80". Empty disables it.
  redirect_listen: ""
  # max-age of the Strict-Transport-Security header (0 disables it).
  hsts_max_age: 4320h
  # Reverse proxies (IPs or CIDR ranges) whose X-Forwarded-For header is trusted
  # to determine the client IP address (used for logging and login lockout).
  trusted_proxies: []
  read_header_timeout: 10s
  shutdown_timeout: 15s

  # See docs/certificates.md for all options and examples.
  tls:
    # acme:  request and renew the certificate from an ACME CA (Let's Encrypt, step-ca, ...).
    # files: certificate and key from PEM files, reloaded when they change.
    # none:  plain HTTP; only for development or behind a TLS-terminating proxy.
    mode: files
    cert_file: /etc/dcdash/tls/cert.pem
    key_file: /etc/dcdash/tls/key.pem
    # How often the files are checked for changes; 0 disables reloading.
    reload_interval: 1m

    # Used with mode: acme.
    acme:
      directory_url: https://acme-v02.api.letsencrypt.org/directory
      email: ""
      # Must be true: accepts the terms of service of the CA.
      accept_tos: false
      domains: []
      key_type: EC256
      # Additional trusted root for the ACME server (e.g. the step-ca root).
      ca_file: ""
      renew_before: 720h
      # External account binding, if the CA requires it.
      eab:
        key_id: ""
        hmac_key: ""
      dns:
        # cloudflare or rfc2136
        provider: cloudflare
        cloudflare:
          # e.g. "file:/etc/dcdash/cloudflare-acme.token" or "env:CLOUDFLARE_ACME_TOKEN"
          api_token: ""
        rfc2136:
          nameserver: ""
          tsig_key: ""
          tsig_secret: ""
          tsig_algorithm: hmac-sha256
        # Resolvers for zone lookup and propagation checks (default: system resolvers).
        resolvers: []
        # 0: provider default.
        propagation_timeout: 0s
        disable_authoritative_check: false

auth:
  ldap:
    # ldaps://host:636, or ldap://host:389 with start_tls: true. Empty disables LDAP login.
    url: ldaps://dc1.example.com:636
    # Several servers for failover, instead of url. A fingerprint pins the certificate
    # of that server and overrides tls.fingerprint.
    # servers:
    #   - url: ldaps://dc1.example.com:636
    #     fingerprint: ""
    #   - url: ldaps://dc2.example.com:636
    #     fingerprint: ""
    start_tls: false
    tls:
      # Additional trusted root certificates (PEM).
      ca_file: ""
      # Pin the server certificate instead (SHA-256, e.g. for Samba's autogenerated
      # certificate): openssl s_client -connect dc1.example.com:636 </dev/null |
      #   openssl x509 -noout -fingerprint -sha256
      fingerprint: ""
      server_name: ""
    # ad (Active Directory, Samba AD) or generic (e.g. OpenLDAP)
    mode: ad
    # Service account used to search users and groups (read access is enough).
    bind_dn: dcdash-svc@example.com
    bind_password: "file:/etc/dcdash/ldap-bind.password"
    base_dn: DC=example,DC=com
    # Defaults depend on the mode; {username} is the escaped login name.
    # user_filter: "(&(objectCategory=person)(objectClass=user)(|(sAMAccountName={username})(userPrincipalName={username})))"
    # group_base_dn: ""   # default: base_dn
    # group_filter: ""    # generic mode only, e.g. "(&(objectClass=groupOfNames)(member={dn}))"
    timeout: 10s
  session:
    # Maximum session duration and inactivity timeout. A shorter idle_timeout logs
    # users out sooner, e.g. when the dcdash tab stays in the background.
    lifetime: 8h
    idle_timeout: 8h
  lockout:
    # Failed logins before a user name or client IP address is locked.
    user: {max_failures: 5, window: 15m, duration: 15m}
    ip: {max_failures: 20, window: 15m, duration: 15m}
    # Failed TOTP or recovery codes before a user is locked.
    totp: {max_failures: 5, window: 15m, duration: 15m}
  totp:
    # Name shown in authenticator apps.
    issuer: dcdash
  # Break-glass account for when the directory is unavailable. It always requires
  # TOTP and holds the root role. Create the hash with `dcdash hash-password` and
  # enroll TOTP with `dcdash totp enroll <username>`.
  local:
    enabled: false
    username: breakglass
    password_hash: "file:/etc/dcdash/breakglass.hash"
  # Directory group (CN or DN) whose members get the built-in root role: all
  # permissions, always with TOTP.
  root_group: dashroot

# Roles map directory groups to permissions (see docs/security.md).
# Permission format: module:instance:resource:action
#   module:   proxmox, dns, dhcp or system
#   action:   read < operate < console < write < admin (a higher action includes the lower ones)
#   "*" is a wildcard, also within a segment (e.g. "*.example.com").
roles: []
#  - name: dns-operator
#    groups: ["dcdash-dns"]
#    require_totp: true          # default; a user needs TOTP if any of their roles requires it
#    permissions:
#      - "dns:cloudflare-prod:*:write"
#      - "dns:bind-internal:*:read"
#  - name: auditor
#    groups: ["CN=dcdash-audit,OU=Groups,DC=example,DC=com"]
#    permissions:
#      - "system:core:audit:read"

# Audit log: logins and every state-changing action, stored in the database
# (see docs/security.md). File and syslog are optional additional outputs.
audit:
  # Delete database entries older than this; 0 keeps them forever. Units: h, m, s or d (days).
  retention: 0
  # Append every entry as a JSON line to this file (empty disables it).
  file: ""
  syslog:
    enabled: false
    # "" and address "" use the local syslog daemon; otherwise udp, tcp or unix.
    network: ""
    address: ""
    tag: dcdash

# Proxmox VE clusters (see docs/proxmox.md). The API token needs the Proxmox
# privileges for what dcdash should do: PVEAuditor to read, PVEVMUser for power
# actions and consoles. Permissions in dcdash use the cluster name as instance,
# e.g. "proxmox:lab:qemu/*:operate".
proxmox:
  clusters: []
