# Kea 3.x DHCP servers (see docs/dhcp.md). dcdash talks to each kea-dhcp4 and
# kea-dhcp6 daemon over its own HTTP(S) control socket. Permissions use the
# server name as instance and the subnet as resource, e.g.
# "dhcp:dhcp4-a:192.0.2.0/24:write".
dhcp:
  servers: []
#  - name: dhcp4-a
#    family: v4                        # v4 (kea-dhcp4) or v6 (kea-dhcp6)
#    url: https://kea1.example.com:8000
#    tls:
#      ca_file: /etc/dcdash/kea-ca.pem # or fingerprint
#      # Client certificate for cert-required: true on the Kea side.
#      cert_file: ""
#      key_file: ""
#    username: dcdash
#    password: "file:/etc/dcdash/kea-dcdash.password"
#    timeout: 15s
#    # Servers of a Kea HA pair share a group: leases are deleted on both.
#    ha_group: site1

# NetBox as a common data source (see docs/netbox.md). Disabled without a URL.
# Permissions use the name as instance: "netbox:netbox:ipam:read" (VLAN names
# and free addresses in the creation wizard), "netbox:netbox:sync:read" and
# "netbox:netbox:sync:write" (comparison view).
netbox:
  url: ""
#  name: netbox
#  url: https://netbox.example.com
#  tls:
#    ca_file: /etc/dcdash/netbox-ca.pem # or fingerprint
#  # A v2 token (nbt_<key>.<token>) or a v1 token.
#  token: "file:/etc/dcdash/netbox.token"
#  timeout: 15s
#  # false: only read from NetBox, never write.
#  write_back: true
#  # Tag (slug) on the objects dcdash creates; create it in NetBox first.
#  tag: dcdash
#  # Deleting a guest: "tagged" deletes VMs with the tag and sets the others to
#  # decommissioning, "delete" always deletes, "decommission" never deletes.
#  on_delete: tagged
#  # Integer custom field of virtual machines with the Proxmox VMID (optional,
#  # recommended). Without it, VMs are found by name.
#  vmid_field: proxmox_vmid
#  # Proxmox cluster (proxmox.clusters[].name) -> NetBox cluster name.
#  clusters:
#    pve-lab: "Lab"
#  # VLAN lookups by VLAN ID in this VLAN group or site (slugs, optional).
#  vlan_group: ""
#  site: ""
#  # VRF of the IP addresses; empty is the global table.
#  vrf: ""

# Prometheus metrics at /metrics (see docs/monitoring.md).
metrics:
  enabled: false
  # Separate plain HTTP listener for /metrics. Empty: /metrics is served on the
  # main listener and requires the token.
  listen: "127.0.0.1:9100"
  # Bearer token Prometheus sends (at least 16 characters); optional on a
  # separate listener.
  token: ""

security:
  # Key (base64, 32 bytes) for secrets stored in the database, e.g. TOTP seeds.
  # Generate one with `dcdash gen-key`. Keep it outside this file, e.g. "file:/etc/dcdash/encryption.key".
  # Losing the key makes the stored secrets unreadable (users must enroll TOTP again).
  encryption_key: "file:/etc/dcdash/encryption.key"
  # After changing the key, list the old one here until all data is re-encrypted
  # (see docs/security.md).
  previous_encryption_keys: []

log:
  # trace, debug, info, warn, error
  level: info
  # json or console
  format: json

# Directory for persistent state (database, ACME account and certificates).
data_dir: /var/lib/dcdash
