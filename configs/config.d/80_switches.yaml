# Aruba CX switches (see docs/switches.md). Permissions use the name as instance:
# "switch:sw-core:*:read" shows the switch, "switch:sw-core:port/1/1/*:write" changes ports,
# "switch:sw-core:vlan/4*:write" manages VLANs.
# With many switches, give each its own file: 81_switch-sw-core.yaml, 82_switch-sw-42.yaml,
# ... Each starts with "switches:" and lists one switch; the lists are joined.

switches: []
