# OPNsense firewalls (see docs/firewalls.md). Permissions use the name as instance:
# "firewall:fw-core:*:read" shows the firewall, "firewall:fw-core:rule/lan:write" changes the
# rules of the LAN interface (always with a savepoint and automatic rollback).
# One file per firewall works as well.

firewalls: []
