#      ca_file: /etc/dcdash/kea-ca.pem # or fingerprint
#      # Client certificate for cert-required: true on the Kea side.
#      cert_file: ""
#      key_file: ""
#    username: dcdash
#    password: "file:/etc/dcdash/kea-dcdash.password"
#    timeout: 15s
#    # Servers of a Kea HA pair share a group: leases are deleted on both.
#    ha_group: site1
#    # Button on the overview tile (optional).
#    ssh: root@kea1.example.com
