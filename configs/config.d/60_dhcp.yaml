# Kea 3.x DHCP servers (see docs/dhcp.md). dcdash talks to each kea-dhcp4 and
# kea-dhcp6 daemon over its own HTTP(S) control socket. Permissions use the
# server name as instance and the subnet as resource, e.g.
# "dhcp:dhcp4-a:192.0.2.0/24:write". One file per server works as well.

dhcp:
  servers: []
