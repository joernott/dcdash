# Login: the LDAP directory, sessions, lockout, TOTP and the break-glass account
# (see docs/security.md). Independent of the Active Directory domains in 20_directories.yaml.

auth:
  ldap:
    # ldaps://host:636, or ldap://host:389 with start_tls: true. Empty disables LDAP login.
    url: ldaps://dc1.example.com:636
    # Several servers for failover, instead of url. A fingerprint pins the certificate
    # of that server and overrides tls.fingerprint.
    # servers:
    #   - url: ldaps://dc1.example.com:636
    #     fingerprint: ""
    #   - url: ldaps://dc2.example.com:636
    #     fingerprint: ""
    start_tls: false
    tls:
      # Additional trusted root certificates (PEM).
      # ca_file: /etc/dcdash/ldap-ca.pem
      # Pin the server certificate instead (SHA-256, e.g. for Samba's autogenerated
      # certificate): openssl s_client -connect dc1.example.com:636 </dev/null |
      #   openssl x509 -noout -fingerprint -sha256
      # fingerprint: "AB:CD:..."
      # server_name: dc1.example.com
    # ad (Active Directory, Samba AD) or generic (e.g. OpenLDAP)
    mode: ad
    # Service account used to search users and groups (read access is enough).
    bind_dn: dcdash-svc@example.com
    bind_password: "file:/etc/dcdash/ldap-bind.password"
    base_dn: DC=example,DC=com
    # Defaults depend on the mode; {username} is the escaped login name.
    # user_filter: "(&(objectCategory=person)(objectClass=user)(|(sAMAccountName={username})(userPrincipalName={username})))"
    # group_base_dn: ""   # default: base_dn
    # group_filter: ""    # generic mode only, e.g. "(&(objectClass=groupOfNames)(member={dn}))"
    timeout: 10s
    # Buttons on the overview tile of the directory (optional).
    # ui: https://dc1.example.com
    # rdp: dc1.example.com
  session:
    # Maximum session duration and inactivity timeout. A shorter idle_timeout logs
    # users out sooner, e.g. when the dcdash tab stays in the background.
    lifetime: 8h
    idle_timeout: 8h
  lockout:
    # Failed logins before a user name or client IP address is locked. They also limit the
    # self-service password change.
    user: {max_failures: 5, window: 15m, duration: 15m}
    ip: {max_failures: 20, window: 15m, duration: 15m}
    # Failed TOTP or recovery codes before a user is locked.
    totp: {max_failures: 5, window: 15m, duration: 15m}
  totp:
    # Name shown in authenticator apps.
    issuer: dcdash
  # Break-glass account for when the directory is unavailable. It always requires
  # TOTP and holds the root role. Create the hash with `dcdash hash-password` and
  # enroll TOTP with `dcdash totp enroll <username>`.
  local:
    enabled: false
    username: breakglass
    password_hash: "file:/etc/dcdash/breakglass.hash"
  # Directory group (CN or DN) whose members get the built-in root role: all
  # permissions, always with TOTP.
  root_group: dashroot
