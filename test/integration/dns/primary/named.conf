// bind9 primary for the DNS integration tests. NOT for production use:
// all keys are test-only.

// TSIG key of dcdash: AXFR and dynamic updates.
key "dcdash." {
	algorithm hmac-sha256;
	secret "fFZGrLET2yX8DfRe1BYU4XHVl2woF0pnApaqrp42jhI=";
};

// rndc key (same as test/integration/dns/rndc.key).
key "rndc-key" {
	algorithm hmac-sha256;
	secret "oXv0AN6jS36312kcDgGVXfmQLxyN6usueBkYq2VSEpY=";
};

controls {
	inet * port 953 allow { any; } keys { "rndc-key"; };
};

options {
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { any; };
	allow-transfer { none; };
	dnssec-validation no;
	// rndc addzone/delzone (zones created by dcdash).
	allow-new-zones yes;
	notify explicit;
};

// Catalog zone (RFC 9432): dcdash adds created zones; the secondary follows.
zone "catalog.dcdash.test" {
	type primary;
	file "/var/lib/bind/catalog.zone";
	update-policy { grant dcdash. zonesub ANY; };
	allow-transfer { key dcdash.; 10.77.0.55; };
	also-notify { 10.77.0.55; };
};

// A zone from the configuration (not in the catalog).
zone "static.dcdash.test" {
	type primary;
	file "/var/lib/bind/static.zone";
	update-policy { grant dcdash. zonesub ANY; };
	allow-transfer { key dcdash.; };
};
