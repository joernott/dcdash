// bind9 secondary for the DNS integration tests: follows the catalog zone of
// the primary. NOT for production use.

options {
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { any; };
	dnssec-validation no;
	catalog-zones {
		zone "catalog.dcdash.test" default-primaries { 10.77.0.54; } in-memory yes;
	};
};

zone "catalog.dcdash.test" {
	type secondary;
	primaries { 10.77.0.54; };
	file "/var/cache/bind/catalog.dcdash.test.db";
};
