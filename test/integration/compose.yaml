# Test environment for the integration tests (scripts/integration-test.sh).
# NOT for production use: all keys and passwords are test-only.
name: dcdash-it

networks:
  it:
    ipam:
      config:
        - subnet: 10.77.0.0/24

services:
  # Authoritative DNS for dcdash.test, accepting TSIG-signed RFC 2136 updates.
  bind:
    image: internetsystemsconsortium/bind9:9.20
    entrypoint:
      - /bin/sh
      - -c
      - >-
        cp /config/db.dcdash.test /var/lib/bind/ &&
        chown bind:bind /var/lib/bind/db.dcdash.test &&
        exec /usr/sbin/named -u bind -g -c /config/named.conf
    volumes:
      - ./bind:/config:ro
    networks:
      it:
        ipv4_address: 10.77.0.53
    healthcheck:
      test: ["CMD-SHELL", "dig +short @127.0.0.1 dcdash.test SOA | grep -q ns.dcdash.test"]
      interval: 2s
      retries: 30

  # Let's Encrypt's ACME test server; validates DNS-01 via the bind container.
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.3
    command: ["-config", "test/config/pebble-config.json", "-dnsserver", "10.77.0.53:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    ports:
      - "127.0.0.1:14000:14000"
    networks:
      it:
        ipv4_address: 10.77.0.10
    depends_on:
      bind:
        condition: service_healthy

  # step-ca with an ACME provisioner named "acme".
  step-ca:
    image: smallstep/step-ca:0.30.2
    environment:
      DOCKER_STEPCA_INIT_NAME: dcdash-it
      DOCKER_STEPCA_INIT_DNS_NAMES: localhost,step-ca
      DOCKER_STEPCA_INIT_ACME: "true"
      DOCKER_STEPCA_INIT_PASSWORD: integration-test-only
    dns:
      - 10.77.0.53
    ports:
      - "127.0.0.1:19000:9000"
    networks:
      it:
        ipv4_address: 10.77.0.20
    healthcheck:
      test: ["CMD", "step", "ca", "health"]
      interval: 2s
      retries: 60
    depends_on:
      bind:
        condition: service_healthy
