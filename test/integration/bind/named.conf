// bind9 configuration for dcdash integration tests. NOT for production use.

// TSIG key used by the ACME DNS-01 tests (RFC 2136 updates); test-only secret.
key "dcdash-acme" {
	algorithm hmac-sha256;
	secret "ewXfZjSD1V7tg9Zfb9LhRq8EZrSbZ6LGrTinSG/wS8o=";
};

options {
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { none; };
	recursion no;
	allow-query { any; };
	allow-transfer { none; };
	dnssec-validation no;
};

zone "dcdash.test" {
	type primary;
	file "/var/lib/bind/db.dcdash.test";
	// The ACME key may only manage TXT records (challenge records).
	update-policy { grant dcdash-acme zonesub TXT; };
};
