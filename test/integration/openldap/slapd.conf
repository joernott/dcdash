# slapd configuration for dcdash integration tests. NOT for production use.
include   /etc/ldap/schema/core.schema
include   /etc/ldap/schema/cosine.schema
include   /etc/ldap/schema/nis.schema
include   /etc/ldap/schema/inetorgperson.schema

modulepath /usr/lib/ldap
moduleload back_mdb

pidfile   /run/slapd.pid

TLSCertificateFile    /certs/cert.pem
TLSCertificateKeyFile /certs/key.pem

database  mdb
suffix    "dc=dcdash,dc=test"
rootdn    "cn=admin,dc=dcdash,dc=test"
rootpw    admin-test-only
directory /var/lib/ldap-it

# Passwords: users may authenticate (bind) but nobody may read them.
access to attrs=userPassword
  by anonymous auth
  by self write
  by * none
# The service account reads everything else; users read their own entry.
access to *
  by dn.exact="cn=dcdash-svc,ou=services,dc=dcdash,dc=test" read
  by self read
  by * none
