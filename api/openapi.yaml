openapi: 3.1.0
info:
  title: dcdash API
  description: |
    REST API of dcdash. All endpoints below `/api/v1` return JSON.
    Errors use the `ErrorBody` schema; `error.code` is stable and translated by the frontend.
  version: 0.1.0
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later

tags:
  - name: system
    description: Health and build information
  - name: auth
    description: Login, logout and session information
  - name: me
    description: Settings of the logged-in user
  - name: audit
    description: Audit log
  - name: admin
    description: Administration of sessions and TOTP enrollments
  - name: proxmox
    description: "Proxmox VE clusters: inventory, power actions, tasks and consoles"
  - name: dns
    description: "DNS zones and records in Cloudflare and bind9"
  - name: dhcp
    description: "Kea DHCP servers: subnets, leases and reservations"

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The process is up and serving HTTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [system]
      operationId: getReady
      summary: Readiness probe
      description: Evaluates all registered readiness checks.
      responses:
        "200":
          description: All checks pass.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: At least one check fails.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Build information
      responses:
        "200":
          description: Version of the running server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: State of dcdash's components and backends
      description: |
        For the dashboard; requires a logged-in user. Unlike /readyz it includes components
        whose failure must not take dcdash out of a load balancer, such as the directory.
        Checks run concurrently with a timeout of 5 seconds each.
      responses:
        "200":
          description: The state of every component.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/docs:
    get:
      tags: [system]
      operationId: listDocs
      summary: Pages of the built-in documentation
      description: |
        The documentation is embedded in the binary; requires a logged-in user. The list is in
        menu order and contains no page content.
      responses:
        "200":
          description: The documentation pages.
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: "#/components/schemas/DocsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/docs/{page}:
    get:
      tags: [system]
      operationId: getDoc
      summary: One page of the built-in documentation, rendered to HTML
      parameters:
        - name: page
          in: path
          required: true
          schema: { type: string }
          example: security
      responses:
        "200":
          description: The page with its HTML.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with user name and password
      description: |
        Verifies the credentials against the directory and starts a session. The session
        token is set as an HttpOnly cookie; the returned csrfToken must be sent in the
        X-CSRF-Token header of all state-changing requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: Session cookie (__Host-dcdash_session).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400":
          description: "Malformed request, or a user name that is too long or contains control characters (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401":
          description: "Invalid credentials (code: invalid_credentials)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "403":
          description: "Break-glass account without TOTP enrollment (code: totp_not_enrolled)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: "Too many failed attempts (code: too_many_attempts)."
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: "The directory is unavailable (code: directory_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - { session: [], csrf: [] }
      responses:
        "204":
          description: Logged out (also when there was no session).
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401":
          description: "Not logged in (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }


  /api/v1/auth/totp:
    post:
      tags: [auth]
      operationId: verifyTOTP
      summary: Complete the login with a TOTP code or a recovery code
      description: |
        Only in the login step "totp". On success the session is fully authenticated and its
        token is replaced (new cookie). Each code is accepted once; recovery codes are single-use.
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400":
          description: "Neither or both of code and recoveryCode given (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401":
          description: "Wrong, expired or already used code (code: invalid_code), or no session (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "The session is not in the TOTP step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll:
    post:
      tags: [auth]
      operationId: startTOTPEnrollment
      summary: Start a TOTP enrollment
      description: |
        In the login step "totp_enroll", or voluntarily when logged in and not yet enrolled.
        Returns a new secret; it becomes active once confirmed with a code. The break-glass
        account cannot enroll here (it uses `dcdash totp enroll`).
      security:
        - { session: [], csrf: [] }
      responses:
        "200":
          description: The secret to add to an authenticator app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Break-glass account (code: forbidden)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "Already enrolled (code: already_enrolled) or wrong login step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll/confirm:
    post:
      tags: [auth]
      operationId: confirmTOTPEnrollment
      summary: Confirm a TOTP enrollment with a code
      description: |
        Activates the secret and returns recovery codes, which are shown only once. In the login
        step "totp_enroll", the session becomes fully authenticated (new cookie).
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentResult" }
        "401":
          description: "Wrong code (code: invalid_code), or no session (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "No enrollment started (code: no_enrollment), already enrolled (code: already_enrolled) or wrong login step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes
      description: Requires a current TOTP code. The old recovery codes stop working.
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: The new recovery codes, shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401":
          description: "Wrong code (code: invalid_code), or not logged in (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/preferences:
    get:
      tags: [me]
      operationId: getPreferences
      summary: Preferences of the logged-in user
      description: Defaults (browser language, system theme) if the user has not saved any.
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [me]
      operationId: setPreferences
      summary: Save the preferences of the logged-in user
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: The saved preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400":
          description: "Invalid value (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: queryAudit
      summary: Query the audit log
      description: |
        Returns audit entries, newest first. Requires the permission `system:core:audit:read`.
        For the next (older) page, pass `nextBefore` as `before`.
      parameters:
        - { name: actor, in: query, schema: { type: string }, description: "User name (exact, case-insensitive)." }
        - { name: action, in: query, schema: { type: string }, description: 'Action, exact or as a prefix ending with "*" (e.g. "auth.*").' }
        - { name: target, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [success, failure, denied] } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Inclusive. }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: Exclusive. }
        - { name: before, in: query, schema: { type: integer, format: int64, minimum: 1 }, description: Only entries with a lower ID. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Matching entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          description: "Invalid filter (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/sessions:
    get:
      tags: [admin]
      operationId: listSessions
      summary: List active sessions
      description: Requires `system:core:sessions:read`. Newest first; tokens are never returned.
      parameters:
        - { name: username, in: query, schema: { type: string }, description: Only sessions of this user (case-insensitive). }
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/sessions/{id}:
    delete:
      tags: [admin]
      operationId: terminateSession
      summary: Terminate a session
      description: Requires `system:core:sessions:write`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Terminated.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "No such session (code: not_found)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{username}/sessions:
    delete:
      tags: [admin]
      operationId: terminateUserSessions
      summary: Terminate all sessions of a user
      description: Requires `system:core:sessions:write`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Number of terminated sessions.
          content:
            application/json:
              schema:
                type: object
                required: [terminated]
                properties:
                  terminated: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{username}/totp:
    delete:
      tags: [admin]
      operationId: resetTOTP
      summary: Reset the TOTP enrollment of a user
      description: |
        Only for root. Removes the user's TOTP secret and recovery codes; directory users enroll
        again at their next login.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Reset.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "The user has no TOTP enrolled (code: not_found)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters:
    get:
      tags: [proxmox]
      operationId: listProxmoxClusters
      summary: List Proxmox clusters
      description: Returns the clusters on which the user holds at least `read` on any resource.
      responses:
        "200":
          description: Visible clusters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxClusterList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/resources:
    get:
      tags: [proxmox]
      operationId: getProxmoxInventory
      summary: Nodes, guests and storage of a cluster
      description: |
        Only entries the user may read are returned: `node/<name>`, `qemu/<vmid>`, `lxc/<vmid>`
        and `storage/<node>/<storage>` (e.g. `proxmox:lab:qemu/*:read`). Usage values are 0
        when the API token lacks the Proxmox privilege to see them.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
      responses:
        "200":
          description: Inventory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxInventory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}:
    get:
      tags: [proxmox]
      operationId: getProxmoxGuest
      summary: Status and configuration of a guest
      description: Requires `read` on `<type>/<vmid>`. Secrets (cipassword) are removed from the configuration.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      responses:
        "200":
          description: Guest details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxGuestDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [proxmox]
      operationId: deleteProxmoxGuest
      summary: Delete a guest
      description: |
        Requires `admin` on `<type>/<vmid>` and provisioning settings for the cluster. The guest
        must be stopped, and `confirm` must be its name. Deletes the guest with its disks in a
        Proxmox task; poll the task for the result. Audited as `proxmox.guest.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDeleteRequest" }
      responses:
        "202":
          description: Task started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxTaskRef" }
        "400":
          description: "Invalid request, or the confirmation doesn't match the name (code: confirmation_mismatch)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware:
    get:
      tags: [proxmox]
      operationId: getProxmoxHardware
      summary: Options, disks and network devices of a VM
      description: |
        Requires `read` on `qemu/<vmid>`; VMs only. Includes pending changes (they take effect at
        the next start of the VM) and the digest that changes send back. `configurable` is true if
        the cluster has provisioning settings; changes need `write` on the VM. See
        docs/adr/0005-proxmox-vm-configuration.md.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      responses:
        "200":
          description: The hardware of the VM.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxHardware" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/options:
    post:
      tags: [proxmox]
      operationId: changeProxmoxOptions
      summary: Change, remove or revert options of a VM
      description: |
        Requires `write` on `qemu/<vmid>` and provisioning settings. Only the options listed in
        `ProxmoxOptionSetting.key` can be set or removed; cores, sockets and memory are limited by
        the provisioning settings. `revert` drops pending changes of any key. Audited as
        `proxmox.guest.configure`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxOptionsRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks:
    post:
      tags: [proxmox]
      operationId: createProxmoxDisk
      summary: Add a new disk to a VM
      description: |
        Requires `write` on `qemu/<vmid>` and provisioning settings: the storage must be allowed and
        the size within the disk limit. The disk gets the first free slot of the bus, returned as
        `key`. Audited as `proxmox.disk.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks/{disk}:
    put:
      tags: [proxmox]
      operationId: updateProxmoxDisk
      summary: Grow a disk or change its options
      description: |
        Requires `write` on `qemu/<vmid>`. Disks can only grow, up to the disk limit. Audited as
        `proxmox.disk.resize` (size only) or `proxmox.disk.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskUpdate" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [proxmox]
      operationId: deleteProxmoxDisk
      summary: Delete a disk and its data
      description: |
        Requires `admin` on `qemu/<vmid>`; `confirm` must be the disk key. An unused disk is
        destroyed; an attached disk is detached and destroyed, which is only possible while the VM is
        stopped (code guest_running otherwise). Audited as `proxmox.disk.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400":
          description: "Invalid request, or the confirmation doesn't match the disk (code: confirmation_mismatch)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks/{disk}/detach:
    post:
      tags: [proxmox]
      operationId: detachProxmoxDisk
      summary: Detach a disk; it stays as an unused disk
      description: |
        Requires `write` on `qemu/<vmid>`. Audited as `proxmox.disk.detach`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks/{disk}/attach:
    post:
      tags: [proxmox]
      operationId: attachProxmoxDisk
      summary: Attach an unused disk
      description: |
        Requires `write` on `qemu/<vmid>`; `disk` is an unused disk (`unusedN`). It gets the first
        free slot of `bus`, returned as `key`. Audited as `proxmox.disk.attach`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/networks:
    post:
      tags: [proxmox]
      operationId: createProxmoxNetwork
      summary: Add a network device to a VM
      description: |
        Requires `write` on `qemu/<vmid>`; bridge and VLAN must be allowed by the provisioning
        settings. Without `mac` dcdash generates one (prefix BC:24:11). The device gets the first
        free `netN`, returned as `key`. Audited as `proxmox.network.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxNetworkRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/networks/{net}:
    put:
      tags: [proxmox]
      operationId: updateProxmoxNetwork
      summary: Change a network device; the MAC address stays
      description: |
        Requires `write` on `qemu/<vmid>`. `mac` is ignored. Audited as `proxmox.network.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxNet"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxNetworkRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [proxmox]
      operationId: deleteProxmoxNetwork
      summary: Remove a network device
      description: |
        Requires `write` on `qemu/<vmid>`. Audited as `proxmox.network.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxNet"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxNetworkAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/provisioning:
    get:
      tags: [proxmox]
      operationId: getProxmoxProvisioningOptions
      summary: Choices for creating a guest on a node
      description: |
        Requires `admin` on any resource of the cluster and provisioning settings for the
        cluster. Returns what the configuration allows and the node offers: storages, ISO
        images, container templates, bridges, templates the user may read, limits and defaults.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: node, in: query, schema: { type: string }, description: The node; default the first online node. }
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxProvisioningOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests:
    post:
      tags: [proxmox]
      operationId: createProxmoxGuest
      summary: Create a VM or container
      description: |
        Requires `admin` on the new `<type>/<vmid>`, `read` on a cloned template, and
        provisioning settings for the cluster, which limit the request. Starts a job that runs
        the steps (clone, configure, resize, create, start) in the background; poll the job.
        Audited as `proxmox.guest.create` when the job ends.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxCreateRequest" }
      responses:
        "202":
          description: Job started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxConflict" }
        "429":
          description: "The user runs 3 creations, or dcdash 20, already (code: too_many_jobs)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/jobs/{id}:
    get:
      tags: [proxmox]
      operationId: getProxmoxJob
      summary: State of a creation job
      description: |
        Visible to the user who started it and to users with `read` on the new guest. Jobs are
        kept in memory for an hour after they end.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/actions/{action}:
    post:
      tags: [proxmox]
      operationId: runProxmoxAction
      summary: Run a power action
      description: |
        Requires `operate` on `<type>/<vmid>`. Starts a Proxmox task and returns its ID; poll the
        task for the result. Audited as `proxmox.guest.<action>`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, shutdown, stop, reboot, suspend, resume] }
      responses:
        "202":
          description: Task started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxTaskRef" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/tasks/{upid}:
    get:
      tags: [proxmox]
      operationId: getProxmoxTask
      summary: Status and log of a task
      description: |
        Requires `read` on the task's guest (`qemu/<id>` or `lxc/<id>`), or on `node/<node>` for
        tasks without a guest.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: upid, in: path, required: true, schema: { type: string }, description: Proxmox task ID (UPID). }
        - { name: log, in: query, schema: { type: string }, description: "Any value: include the log (up to 500 lines)." }
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxTask" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/console:
    post:
      tags: [proxmox]
      operationId: openProxmoxGuestConsole
      summary: Prepare the console of a guest
      description: |
        Requires `console` on `<type>/<vmid>`. Virtual machines get a VNC console (noVNC),
        containers a terminal (xterm.js). Terminals need a console user in the cluster
        configuration (409 otherwise). Open the websocket `/api/v1/proxmox/console/{id}` within
        15 seconds.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      responses:
        "200":
          description: Console prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConsoleTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Terminals need a console user in the cluster configuration (code: terminal_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/TooManyConsoles" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/nodes/{node}/shell:
    post:
      tags: [proxmox]
      operationId: openProxmoxNodeShell
      summary: Prepare a shell on a node
      description: |
        A node shell is root access to the hypervisor, so it requires `admin` on `node/<node>`.
        Open the websocket `/api/v1/proxmox/console/{id}` within 15 seconds.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shell prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConsoleTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Terminals need a console user in the cluster configuration (code: terminal_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/TooManyConsoles" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/console/{id}:
    get:
      tags: [proxmox]
      operationId: connectProxmoxConsole
      summary: Console websocket
      description: |
        Websocket (subprotocol `binary`) proxied to Proxmox. The ticket is valid once, for 15
        seconds, and only for the session that prepared it. VNC consoles speak RFB (password:
        `ProxmoxConsoleTicket.password`); terminals speak the Proxmox termproxy protocol
        (`0:<length>:<data>` input, `1:<cols>:<rows>:` resize, `2` ping), the login is done by
        dcdash. The connection ends when the dcdash session ends. Start and end are audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "101":
          description: Switching to the websocket protocol.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers:
    get:
      tags: [dns]
      operationId: listDNSProviders
      summary: List DNS providers
      description: Returns the providers on which the user holds at least `read` on any zone.
      responses:
        "200":
          description: Visible providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSProviderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones:
    get:
      tags: [dns]
      operationId: listDNSZones
      summary: List the zones of a provider
      description: Only zones the user may read are returned (`dns:<provider>:<zone>:read`).
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
      responses:
        "200":
          description: Zones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZoneList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [dns]
      operationId: createDNSZone
      summary: Create a zone
      description: |
        Requires `admin` on the zone. bind9: uploads the zone file over SFTP, adds the zone with
        rndc addzone and lists it in the catalog zone. Cloudflare: creates a "pending" zone; the
        registrar must delegate it to the returned name servers. Audited as `dns.zone.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSZoneRequest" }
      responses:
        "201":
          description: Zone created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZone" }
        "400": { $ref: "#/components/responses/DNSInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones/{zone}:
    delete:
      tags: [dns]
      operationId: deleteDNSZone
      summary: Delete a zone
      description: |
        Requires `admin` on the zone and the zone name repeated in `confirm`. bind9 can delete
        only zones of the catalog zone (zones created by dcdash), not zones from named.conf.
        Audited as `dns.zone.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
        - { name: confirm, in: query, required: true, schema: { type: string }, description: The zone name again. }
      responses:
        "204": { description: Zone deleted. }
        "400":
          description: "The confirmation is missing or wrong (code: confirmation_required)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones/{zone}/records:
    get:
      tags: [dns]
      operationId: listDNSRecords
      summary: List the records of a zone
      description: Requires `read` on the zone.
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
      responses:
        "200":
          description: Records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecordSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [dns]
      operationId: createDNSRecord
      summary: Create a record
      description: |
        Requires `write` on the zone. `version` is the version of the record set. Audited as
        `dns.record.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordRequest" }
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecord" }
        "400": { $ref: "#/components/responses/DNSInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "422": { $ref: "#/components/responses/DNSRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones/{zone}/records/{id}:
    put:
      tags: [dns]
      operationId: updateDNSRecord
      summary: Replace a record
      description: |
        Requires `write` on the zone. `version` is the version of the record as read. For bind9
        the ID changes when the name, type or content changes. Audited as `dns.record.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
        - $ref: "#/components/parameters/DNSRecordID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordRequest" }
      responses:
        "200":
          description: Record replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecord" }
        "400": { $ref: "#/components/responses/DNSInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "422": { $ref: "#/components/responses/DNSRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [dns]
      operationId: deleteDNSRecord
      summary: Delete a record
      description: Requires `write` on the zone. Audited as `dns.record.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
        - $ref: "#/components/parameters/DNSRecordID"
        - { name: version, in: query, required: true, schema: { type: string }, description: Version of the record as read. }
      responses:
        "204": { description: Record deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers:
    get:
      tags: [dhcp]
      operationId: listDHCPServers
      summary: List DHCP servers
      description: |
        Returns the Kea servers on which the user holds at least `read` on any subnet, with
        their state, capabilities (from the loaded hook libraries) and HA state.
      responses:
        "200":
          description: Visible servers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPServerList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/subnets:
    get:
      tags: [dhcp]
      operationId: listDHCPSubnets
      summary: List the subnets of a server
      description: |
        Only subnets the user may read are returned (`dhcp:<server>:<prefix>:read`). Pools need
        the subnet_cmds hook, statistics the stat_cmds hook.
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
      responses:
        "200":
          description: Subnets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPSubnetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/leases:
    get:
      tags: [dhcp]
      operationId: listDHCPLeases
      summary: List or search leases
      description: |
        Either the leases of one subnet (`subnet`, at most 5000) or a search (`by` and `q`).
        Only leases of readable subnets are returned. Needs the lease_cmds hook.
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - { name: subnet, in: query, schema: { type: integer, minimum: 1 }, description: Subnet ID. }
        - name: by
          in: query
          schema: { type: string, enum: [ip, hw-address, client-id, duid, hostname] }
          description: Search key; the server's searchKeys lists those of its family.
        - { name: q, in: query, schema: { type: string }, description: Search value. }
      responses:
        "200":
          description: Leases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPLeaseList" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/leases/{ip}:
    delete:
      tags: [dhcp]
      operationId: deleteDHCPLease
      summary: Delete a lease
      description: |
        Requires `operate` on the lease's subnet. Kea doesn't pass this change to an HA partner,
        so dcdash deletes the lease on the other servers of the HA group too and reports the
        result per partner. Audited as `dhcp.lease.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - { name: ip, in: path, required: true, schema: { type: string }, description: Address or delegated prefix. }
        - { name: type, in: query, schema: { type: string, enum: [IA_NA, IA_PD] }, description: "DHCPv6: lease type (default IA_NA)." }
      responses:
        "200":
          description: Lease deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPLeaseDeleteResult" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/reservations:
    get:
      tags: [dhcp]
      operationId: listDHCPReservations
      summary: List reservations
      description: |
        Reservations from the configuration file (read-only) and the host database, of all
        readable subnets or of one subnet. Needs the host_cmds hook.
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - { name: subnet, in: query, schema: { type: integer, minimum: 0 }, description: "Subnet ID; 0 for global reservations." }
      responses:
        "200":
          description: Reservations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPReservationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [dhcp]
      operationId: createDHCPReservation
      summary: Add a reservation
      description: |
        Requires `write` on the subnet and a host database: on this server, or on a partner of
        its HA group (the partners share the host database). Audited as
        `dhcp.reservation.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DHCPReservationRequest" }
      responses:
        "201":
          description: Reservation added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPReservation" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "422": { $ref: "#/components/responses/DHCPRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/reservations/{id}:
    put:
      tags: [dhcp]
      operationId: updateDHCPReservation
      summary: Change a reservation
      description: |
        Requires `write` on the subnet. Subnet and identifier can't change. Client classes,
        options and boot fields are kept. Audited as `dhcp.reservation.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - $ref: "#/components/parameters/DHCPReservationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DHCPReservationRequest" }
      responses:
        "200":
          description: Reservation changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPReservation" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "422": { $ref: "#/components/responses/DHCPRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [dhcp]
      operationId: deleteDHCPReservation
      summary: Delete a reservation
      description: Requires `write` on the subnet. Audited as `dhcp.reservation.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - $ref: "#/components/parameters/DHCPReservationID"
        - { name: version, in: query, required: true, schema: { type: string }, description: Version of the reservation as read. }
      responses:
        "204": { description: Reservation deleted. }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-dcdash_session
      description: Session cookie, set by login.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The csrfToken of the session (returned by login and GET /api/v1/auth/me). Required for
        all state-changing requests of a session.

  parameters:
    ProxmoxCluster: { name: cluster, in: path, required: true, schema: { type: string }, description: Cluster name from the configuration. }
    ProxmoxGuestType: { name: type, in: path, required: true, schema: { type: string, enum: [qemu, lxc] } }
    ProxmoxVMID: { name: vmid, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ProxmoxDisk: { name: disk, in: path, required: true, schema: { type: string, pattern: "^(scsi|virtio|sata|ide|unused)[0-9]+$" }, description: "Disk key, e.g. scsi1 or unused0." }
    ProxmoxNet: { name: net, in: path, required: true, schema: { type: string, pattern: "^net[0-9]+$" }, description: "Network device key, e.g. net1." }

    DNSProvider: { name: provider, in: path, required: true, schema: { type: string }, description: Provider name from the configuration. }
    DNSZone: { name: zone, in: path, required: true, schema: { type: string }, description: Zone name without trailing dot. }
    DNSRecordID: { name: id, in: path, required: true, schema: { type: string } }

    DHCPServer: { name: server, in: path, required: true, schema: { type: string }, description: Server name from the configuration. }
    DHCPReservationID: { name: id, in: path, required: true, schema: { type: string }, description: The id of the reservation as listed. }
  responses:
    DHCPInvalid:
      description: "Invalid reservation (code: invalid_reservation, with the reason as message) or request (invalid_request)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DHCPConflict:
      description: |
        Codes: conflict (changed since it was read, or Kea reports a conflict), read_only (the
        reservation is in the configuration file), unsupported (the server lacks the hook
        library or the host database).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DHCPRejected:
      description: "Kea rejected the change, e.g. a duplicate reservation (code: rejected, with Kea's message)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DNSInvalid:
      description: "Invalid record or zone (code: invalid_record, with the reason as message) or body (invalid_request)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DNSConflict:
      description: |
        Codes: conflict (changed since it was read, reload and try again), exists (the record or
        zone exists already), unsupported (the provider can't create or delete zones).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DNSRejected:
      description: "The server accepted the update but didn't apply it, e.g. a CNAME next to other records (code: rejected)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: "Not found (code: not_found)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ProxmoxChangeDone:
      description: The change is done.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProxmoxConfigResult" }
    ProxmoxChangeRunning:
      description: The Proxmox task was still running after 60 seconds; the task list shows its end.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProxmoxConfigResult" }
    ProxmoxChangeConflict:
      description: |
        Codes: provisioning_disabled (the cluster has no provisioning settings), config_changed
        (the configuration changed since it was read: reload and try again), no_free_slot (no free
        slot on the bus), guest_running (stop the VM or detach the disk first).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ProxmoxConflict:
      description: |
        Codes: provisioning_disabled (the cluster has no provisioning settings),
        vmid_taken (the requested ID is in use), no_free_vmid (no free ID of the range may be
        used by the user),
        guest_running (stop the guest before deleting it).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Upstream:
      description: |
        The backend failed. Codes: upstream_unavailable (not reachable), upstream_forbidden
        (the backend denied the request, e.g. missing privileges of the API token), upstream_error
        (message from the backend).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    TooManyConsoles:
      description: "The session is already preparing 3 consoles that were not opened yet (code: too_many_consoles)."
      headers:
        Retry-After:
          description: Seconds until a console can be prepared again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    TooManyAttempts:
      description: "Too many failed attempts (code: too_many_attempts)."
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: "Not logged in (code: not_authenticated)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: "Permission denied (code: forbidden)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 256 }
        password: { type: string, format: password }

    SessionInfo:
      type: object
      required: [user, stage, csrfToken, expiresAt, roles, permissions, totp]
      properties:
        user: { $ref: "#/components/schemas/UserInfo" }
        stage:
          type: string
          enum: [authenticated, totp, totp_enroll]
          description: |
            authenticated: fully logged in; totp: a TOTP or recovery code is still required;
            totp_enroll: the user must enroll TOTP first. Pending steps expire after 10 minutes.
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time, description: Absolute end of the session. }
        roles:
          type: array
          items: { type: string }
          description: Roles of the user; empty until all login steps are completed.
        permissions:
          type: array
          items: { type: string }
          description: |
            Granted permissions (module:instance:resource:action); empty until all login steps
            are completed. The frontend uses them to hide what the user cannot use; the backend
            checks every request.
        totp: { $ref: "#/components/schemas/TOTPInfo" }

    TOTPInfo:
      type: object
      required: [enrolled, required, recoveryCodesRemaining]
      properties:
        enrolled: { type: boolean }
        required: { type: boolean, description: A role of the user requires TOTP (always for root and the break-glass account). }
        recoveryCodesRemaining: { type: integer }

    TOTPRequest:
      type: object
      description: Exactly one of code and recoveryCode.
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        recoveryCode: { type: string, examples: ["k7m2-x9pq-4hvt-c3wn"] }

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    EnrollmentInfo:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        uri: { type: string, description: "otpauth:// URI, to be shown as QR code." }

    EnrollmentResult:
      type: object
      required: [recoveryCodes, session]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
        session: { $ref: "#/components/schemas/SessionInfo" }

    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }

    SessionSummary:
      type: object
      required: [id, username, displayName, source, stage, createdAt, lastSeenAt, expiresAt, remoteAddr, userAgent, current]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [ldap, local] }
        stage: { type: string, enum: [authenticated, totp, totp_enroll] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        remoteAddr: { type: string }
        userAgent: { type: string }
        current: { type: boolean, description: The session of the request. }

    Preferences:
      type: object
      required: [language, theme]
      additionalProperties: false
      properties:
        language:
          type: string
          enum: ["", en, de]
          description: Empty means the browser language.
        theme:
          type: string
          enum: [system, light, dark]

    UserInfo:
      type: object
      required: [username, displayName, source, groups]
      properties:
        username: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [ldap, local] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupInfo" }

    GroupInfo:
      type: object
      required: [dn, name]
      properties:
        dn: { type: string }
        name: { type: string }

    AuditPage:
      type: object
      required: [entries, nextBefore]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextBefore:
          type: [integer, "null"]
          format: int64
          description: Value of "before" for the next page; null on the last page.

    AuditEntry:
      type: object
      required: [id, time, actor, actorSource, clientIp, action, target, result, details, requestId]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        actor: { type: string, description: "User name; for failed logins the name that was given." }
        actorSource: { type: string, enum: [ldap, local, cli, system, anonymous] }
        clientIp: { type: string }
        action: { type: string, examples: [auth.login, authz.denied] }
        target: { type: string, description: The object acted on (may be empty). }
        result: { type: string, enum: [success, failure, denied] }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }

    DocsPage:
      type: object
      required: [name, title]
      properties:
        name:
          type: string
          description: Page name, the Markdown file name without ".md".
          examples: [security]
        title:
          type: string
          description: Text of the first heading.
        html:
          type: string
          description: |
            The page as HTML, only in GET /api/v1/docs/{page}. Raw HTML of the Markdown is not
            rendered. Links between pages point to /docs/<page>, other links point to GitHub
            and have target="_blank". Heading IDs and link fragments have the prefix "doc-".
    StatusReport:
      type: object
      required: [components, checkedAt]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/StatusComponent" }
        checkedAt: { type: string, format: date-time }

    StatusComponent:
      type: object
      required: [name, kind, status, detail, latencyMs]
      properties:
        name: { type: string, examples: [database, directory, certificate] }
        kind:
          type: string
          description: '"system" for dcdash itself, otherwise the module (proxmox, dns, dhcp).'
        status: { type: string, enum: [ok, error] }
        detail: { type: string, description: A detail such as "valid until ..." or the error message, in English. }
        detailCode:
          type: string
          description: |
            Identifies the detail for translation; missing if there is none, for example for
            an error message of a backend. Codes: `certificate.valid` (`until`),
            `certificate.missing`, `certificate.expired` (`at`), `proxmox.connected` (`version`,
            `endpoint`), `dns.bind` (`server`, `count`), `dns.bindChecked` (`server`, `count`,
            `checked`), `dns.cloudflare` (`count`), `dhcp.kea` (`version`), `dhcp.keaHA`
            (`version`, `ha`), `dhcp.partnerOutOfTouch` (`partner`), `directory.connected` (`server`,
            `count`), `directory.degraded` (`server`, `down`). Times are RFC 3339.
          examples: [certificate.valid]
        detailParams:
          type: object
          description: Parameters of detailCode.
          additionalProperties: { type: string }
        latencyMs: { type: integer, format: int64 }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: 'Result per check: "ok", a detail such as "valid until <time>", or "error: <message>".'
          additionalProperties: { type: string }

    VersionInfo:
      type: object
      required: [version, commit, date, goVersion]
      properties:
        version: { type: string, examples: ["v0.1.0"] }
        commit: { type: string }
        date: { type: string, description: Build date (RFC 3339) or "unknown" }
        goVersion: { type: string, examples: ["go1.27.4"] }

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [not_found]
            message:
              type: string
              description: English fallback message.

    ProxmoxClusterList:
      type: object
      required: [clusters]
      properties:
        clusters:
          type: array
          items:
            type: object
            required: [name, terminals, provisioning]
            properties:
              name: { type: string }
              terminals:
                type: boolean
                description: |
                  Container terminals and node shells are available. They need a console user in the
                  cluster configuration, because Proxmox does not accept API tokens for them.
              provisioning:
                type: boolean
                description: |
                  Guests can be created and deleted (the cluster has provisioning settings). Users
                  also need `admin` on the guests.

    ProxmoxInventory:
      type: object
      required: [nodes, guests, storage]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxNode" }
        guests:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxGuest" }
        storage:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxStorage" }

    ProxmoxNode:
      type: object
      required: [name, status, cpu, maxCpu, mem, maxMem, disk, maxDisk, uptime]
      properties:
        name: { type: string }
        status: { type: string, description: "online, offline or unknown" }
        cpu: { type: number, description: CPU usage (0..1). }
        maxCpu: { type: number }
        mem: { type: integer, format: int64, description: Bytes. }
        maxMem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxDisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64, description: Seconds. }

    ProxmoxGuest:
      type: object
      required: [type, vmid, name, node, status, template, tags, pool, lock, haState, cpu, maxCpu, mem, maxMem, disk, maxDisk, uptime]
      properties:
        type: { type: string, enum: [qemu, lxc] }
        vmid: { type: integer }
        name: { type: string }
        node: { type: string }
        status: { type: string, description: "running, stopped, paused, ..." }
        template: { type: boolean }
        tags:
          type: array
          items: { type: string }
        pool: { type: string }
        lock: { type: string }
        haState: { type: string }
        cpu: { type: number }
        maxCpu: { type: number }
        mem: { type: integer, format: int64 }
        maxMem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxDisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }

    ProxmoxStorage:
      type: object
      required: [name, node, status, disk, maxDisk]
      properties:
        name: { type: string }
        node: { type: string }
        status: { type: string }
        disk: { type: integer, format: int64 }
        maxDisk: { type: integer, format: int64 }

    ProxmoxGuestDetail:
      type: object
      required: [guest, status, config]
      properties:
        guest:
          allOf: [{ $ref: "#/components/schemas/ProxmoxGuest" }]
          description: >-
            The guest, with `status` taken from status/current (qmpstatus for VMs). The inventory
            uses /cluster/resources, which lags about 10 seconds behind.
        status:
          type: object
          additionalProperties: true
          description: Proxmox status/current as returned by Proxmox.
        config:
          type: object
          additionalProperties: true
          description: Proxmox configuration as returned by Proxmox, without secrets.

    ProxmoxTaskRef:
      type: object
      required: [upid, node]
      properties:
        upid: { type: string }
        node: { type: string }

    ProxmoxTask:
      type: object
      required: [upid, node, type, id, user, running, exitStatus, ok, startTime, log]
      properties:
        upid: { type: string }
        node: { type: string }
        type: { type: string, description: "e.g. qmstart, vzshutdown" }
        id: { type: string, description: Usually the VMID. }
        user: { type: string }
        running: { type: boolean }
        exitStatus: { type: string, description: "OK or the error message, once stopped." }
        ok: { type: boolean }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        log:
          type: array
          items: { type: string }

    ProxmoxProvisioningOptions:
      type: object
      required: [node, nodes, storages, isos, containerTemplates, bridges, vlans, vmids, templates, pool, limits, defaults]
      properties:
        node: { type: string, description: The node the storages, images and bridges belong to; empty without nodes. }
        nodes:
          type: array
          description: Online nodes the user may read.
          items: { type: string }
        storages:
          type: array
          items:
            type: object
            required: [name, type, shared, avail, total, vm, container]
            properties:
              name: { type: string }
              type: { type: string, description: "Proxmox storage type, e.g. lvmthin, rbd, dir" }
              shared: { type: boolean }
              avail: { type: integer, format: int64, description: Free bytes. }
              total: { type: integer, format: int64 }
              vm: { type: boolean, description: Holds VM disks. }
              container: { type: boolean, description: Holds container root file systems. }
        isos:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxVolume" }
        containerTemplates:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxVolume" }
        bridges:
          type: array
          items:
            type: object
            required: [name, vlanAware]
            properties:
              name: { type: string }
              vlanAware: { type: boolean }
        vlans:
          type: array
          description: Allowed VLAN tags as numbers or ranges ("100-199"); empty means untagged only.
          items: { type: string }
        vmids:
          type: array
          description: The range of IDs for new guests; empty means any.
          items: { type: string }
        templates:
          type: array
          description: VM templates the user may clone.
          items:
            type: object
            required: [vmid, name, node]
            properties:
              vmid: { type: integer }
              name: { type: string }
              node: { type: string }
        pool: { type: string, description: Proxmox pool new guests are added to. }
        limits:
          type: object
          required: [cores, memory, disk]
          properties:
            cores: { type: integer }
            memory: { type: integer, format: int64, description: MiB. }
            disk: { type: integer, format: int64, description: GiB. }
        defaults:
          type: object
          required: [cores, memory, disk, storage, bridge]
          properties:
            cores: { type: integer }
            memory: { type: integer, format: int64, description: MiB. }
            disk: { type: integer, format: int64, description: GiB. }
            storage: { type: string }
            bridge: { type: string }

    ProxmoxVolume:
      type: object
      required: [volid, size, format]
      properties:
        volid: { type: string, description: "e.g. local:iso/debian-13.4.0-amd64-netinst.iso" }
        size: { type: integer, format: int64 }
        format: { type: string }

    ProxmoxCreateRequest:
      type: object
      required: [type, name, cores, memory, disk, network]
      properties:
        type: { type: string, enum: [qemu, lxc] }
        node: { type: string, description: Node of a new VM from an ISO image or of a container; clones are created on the template's node. }
        vmid: { type: integer, description: Omit for the next free ID of the range. }
        name: { type: string, description: Host name. }
        source: { type: string, enum: [template, iso], description: VMs only. }
        template: { type: integer, description: VM ID of the template to clone. }
        full: { type: boolean, description: Full clone (otherwise linked). }
        iso: { type: string, description: Volume of the ISO image. }
        osType: { type: string, enum: [linux, windows, other], description: "VMs from an ISO image; windows adds UEFI and a TPM." }
        osTemplate: { type: string, description: Volume of the container template. }
        cores: { type: integer }
        memory: { type: integer, format: int64, description: MiB. }
        disk: { type: integer, format: int64, description: "GiB; for clones 0 keeps the template's size, a larger value grows the boot disk." }
        storage: { type: string, description: Storage of the disk; not for linked clones. }
        network:
          type: object
          required: [bridge]
          properties:
            bridge: { type: string }
            vlan: { type: integer }
            ipv4: { type: string, description: '"dhcp" or an address with prefix length (containers and cloud-init).' }
            gateway4: { type: string }
            ipv6: { type: string, description: '"auto", "dhcp" or an address with prefix length.' }
            gateway6: { type: string }
            nameservers:
              type: array
              maxItems: 3
              items: { type: string }
            searchDomain: { type: string }
        user: { type: string, description: Cloud-init user of a clone. }
        password: { type: string, writeOnly: true, description: Cloud-init password of a clone, or the root password of a container. }
        sshKeys: { type: string, description: Public SSH keys, one per line. }
        start: { type: boolean, description: Start the guest when it's ready. }
        description: { type: string }
        tags:
          type: array
          items: { type: string }

    ProxmoxJob:
      type: object
      required: [id, cluster, type, vmid, node, name, user, state, steps, created]
      properties:
        id: { type: string }
        cluster: { type: string }
        type: { type: string, enum: [qemu, lxc] }
        vmid: { type: integer }
        node: { type: string }
        name: { type: string }
        user: { type: string, description: The user who started the job. }
        state: { type: string, enum: [running, done, failed] }
        error: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: { type: string, enum: [clone, configure, resize, create, start] }
              state: { type: string, enum: [pending, running, done, failed, skipped] }
              upid: { type: string, description: The Proxmox task of the step. }
              error: { type: string }
        created: { type: string, format: date-time }
        ended: { type: string, format: date-time }

    ProxmoxHardware:
      type: object
      required: [digest, running, options, disks, networks, configurable, storages, bridges, vlans, limits]
      properties:
        digest: { type: string, description: Identifies the configuration; changes send it back. }
        running: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxOptionSetting" }
        disks:
          type: array
          description: Attached and unused disks, without CD-ROM drives.
          items: { $ref: "#/components/schemas/ProxmoxHardwareDisk" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxNetworkDevice" }
        configurable: { type: boolean, description: The cluster has provisioning settings. }
        storages: { type: array, items: { type: string }, description: Storages for new disks. }
        bridges: { type: array, items: { type: string } }
        vlans: { type: array, items: { type: string }, description: "Allowed VLAN ranges, e.g. 100-199." }
        limits:
          type: object
          required: [cores, memory, disk]
          properties:
            cores: { type: integer }
            memory: { type: integer, description: MiB }
            disk: { type: integer, description: GiB }
    ProxmoxOptionSetting:
      type: object
      required: [key, value, set]
      properties:
        key:
          type: string
          enum: [name, description, tags, onboot, protection, agent, boot, cores, sockets, memory, balloon, cpu, numa, ostype, hotplug]
        value: { type: string, description: The active value. }
        set: { type: boolean, description: False if the option is not set (Proxmox uses its default). }
        pending: { type: string, description: A change that takes effect at the next start. }
        delete: { type: boolean, description: The removal is pending. }
    ProxmoxHardwareDisk:
      type: object
      required: [key, bus, volume, storage, size, sizeBytes, discard, ssd, iothread, backup, active]
      properties:
        key: { type: string, examples: [scsi0] }
        bus: { type: string, enum: [scsi, virtio, sata, ide, unused] }
        volume: { type: string, examples: ["local-lvm:vm-101-disk-0"] }
        storage: { type: string }
        size: { type: string, examples: [32G] }
        sizeBytes: { type: integer, format: int64 }
        discard: { type: boolean }
        ssd: { type: boolean }
        iothread: { type: boolean }
        backup: { type: boolean, description: False if the disk is excluded from backups. }
        active: { type: boolean, description: False if the addition of the disk is pending. }
        pending: { type: string, description: Pending value. }
        delete: { type: boolean }
    ProxmoxNetworkDevice:
      type: object
      required: [key, model, mac, bridge, firewall, linkDown, active]
      properties:
        key: { type: string, examples: [net0] }
        model: { type: string, enum: [virtio, e1000, e1000e, vmxnet3, rtl8139] }
        mac: { type: string, examples: ["BC:24:11:12:34:56"] }
        bridge: { type: string }
        vlan: { type: integer }
        firewall: { type: boolean }
        linkDown: { type: boolean }
        active: { type: boolean }
        pending: { type: string }
        delete: { type: boolean }
    ProxmoxOptionsRequest:
      type: object
      properties:
        digest: { type: string }
        set: { type: object, additionalProperties: { type: string } }
        delete: { type: array, items: { type: string } }
        revert: { type: array, items: { type: string }, description: Keys whose pending changes are dropped. }
    ProxmoxDiskRequest:
      type: object
      required: [bus, storage, sizeGiB]
      properties:
        digest: { type: string }
        bus: { type: string, enum: [scsi, virtio, sata, ide] }
        storage: { type: string }
        sizeGiB: { type: integer, minimum: 1 }
        discard: { type: boolean }
        ssd: { type: boolean, description: Not on virtio. }
        iothread: { type: boolean, description: Only on scsi and virtio. }
        noBackup: { type: boolean }
    ProxmoxDiskUpdate:
      type: object
      properties:
        digest: { type: string }
        sizeGiB: { type: integer, description: New size; larger than the current one. Omit to keep it. }
        discard: { type: boolean }
        ssd: { type: boolean }
        iothread: { type: boolean }
        noBackup: { type: boolean }
    ProxmoxDiskAction:
      type: object
      properties:
        digest: { type: string }
        bus: { type: string, enum: [scsi, virtio, sata, ide], description: For attach. }
        confirm: { type: string, description: For delete, the disk key. }
    ProxmoxNetworkRequest:
      type: object
      required: [model, bridge]
      properties:
        digest: { type: string }
        model: { type: string, enum: [virtio, e1000, e1000e, vmxnet3, rtl8139] }
        bridge: { type: string }
        vlan: { type: integer }
        firewall: { type: boolean }
        linkDown: { type: boolean }
        mac: { type: string, description: For new devices; empty generates one. }
    ProxmoxNetworkAction:
      type: object
      properties:
        digest: { type: string }
    ProxmoxConfigResult:
      type: object
      required: [node, done]
      properties:
        key: { type: string, description: The disk or network device that was created or attached. }
        upid: { type: string }
        node: { type: string }
        done: { type: boolean, description: False if the task was still running. }
    ProxmoxDeleteRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, description: "The guest's name (or its ID if it has no name), typed by the user." }
        purge: { type: boolean, description: Also remove the guest from backup jobs, replication and HA. }

    ProxmoxConsoleTicket:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, description: One-time ticket for the websocket. }
        kind: { type: string, enum: [vnc, term] }
        password: { type: string, description: VNC password for noVNC (only for vnc). }

    DNSCapabilities:
      type: object
      required: [proxied, comments, autoTtl, zoneCreate]
      properties:
        proxied: { type: boolean, description: Records have the Cloudflare proxy flag. }
        comments: { type: boolean, description: Records have comments. }
        autoTtl: { type: boolean, description: TTL 1 means automatic. }
        zoneCreate: { type: boolean, description: Zones can be created and deleted. }

    DNSProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [name, kind, capabilities]
            properties:
              name: { type: string }
              kind: { type: string, enum: [cloudflare, bind] }
              capabilities: { $ref: "#/components/schemas/DNSCapabilities" }

    DNSZone:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Zone name without trailing dot. }
        status: { type: string, description: "Cloudflare: active, pending, ..." }
        nameServers:
          type: array
          items: { type: string }
          description: Cloudflare name servers to delegate the zone to.

    DNSZoneList:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items: { $ref: "#/components/schemas/DNSZone" }

    DNSZoneRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }

    DNSRecord:
      type: object
      required: [id, name, type, ttl, content, version]
      properties:
        id: { type: string }
        name: { type: string, description: Fully qualified name without trailing dot. }
        type: { type: string, examples: [A, MX, TXT] }
        ttl: { type: integer, description: Seconds; 1 means automatic (Cloudflare). }
        content:
          type: string
          description: RDATA in zone-file presentation format, e.g. "10 mail.example.org." for MX.
        proxied: { type: boolean, description: Cloudflare proxy flag (A, AAAA, CNAME). }
        comment: { type: string }
        readOnly: { type: boolean, description: SOA, DNSSEC and other types dcdash can't edit. }
        version: { type: string, description: Send back with an update or delete. }

    DNSRecordSet:
      type: object
      required: [records, version]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/DNSRecord" }
        version: { type: string, description: "Send with a new record (bind9: SOA serial; empty for Cloudflare)." }

    DNSRecordRequest:
      type: object
      required: [name, type, content]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Relative to the zone, "@" for the apex, or fully qualified.
        type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, PTR, NS, CAA] }
        ttl: { type: integer, minimum: 0, description: "0: the default of the provider." }
        content:
          type: string
          description: RDATA in presentation format; plain TXT text is quoted automatically.
        proxied: { type: boolean }
        comment: { type: string }
        version: { type: string }

    DHCPCapabilities:
      type: object
      required: [leases, leaseDelete, reservations, reservationWrite, subnets, statistics, ha]
      properties:
        leases: { type: boolean, description: List and search leases (lease_cmds). }
        leaseDelete: { type: boolean, description: Delete leases (lease_cmds). }
        reservations: { type: boolean, description: List reservations (host_cmds). }
        reservationWrite: { type: boolean, description: Change reservations (host_cmds and a host database). }
        subnets: { type: boolean, description: Pools of the subnets (subnet_cmds). }
        statistics: { type: boolean, description: Utilization of the subnets (stat_cmds). }
        ha: { type: boolean, description: The HA hook is loaded. }

    DHCPServer:
      type: object
      required: [name, family, status, capabilities, hostDatabase, ha, searchKeys]
      properties:
        name: { type: string }
        family: { type: string, enum: [v4, v6] }
        haGroup: { type: string }
        partners:
          type: array
          items: { type: string }
          description: The other servers of the HA group.
        status: { type: string, enum: [ok, unavailable] }
        error: { type: string, description: Why the server is unavailable. }
        version: { type: string, examples: ["3.0.4"] }
        uptime: { type: integer, description: Seconds since the start. }
        capabilities: { $ref: "#/components/schemas/DHCPCapabilities" }
        hostDatabase: { type: boolean }
        ha:
          type: array
          items:
            type: object
            required: [mode, role, state, partner, partnerState, inTouch]
            properties:
              mode: { type: string, examples: [hot-standby, load-balancing] }
              role: { type: string }
              state: { type: string }
              partner: { type: string }
              partnerState: { type: string }
              inTouch: { type: boolean }
        searchKeys:
          type: array
          items: { type: string, enum: [ip, hw-address, client-id, duid, hostname] }

    DHCPServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/DHCPServer" }

    DHCPSubnetStats:
      type: object
      required: [subnetId, total, assigned, declined]
      properties:
        subnetId: { type: integer }
        total: { type: number, description: Addresses in the pools (v6 IA_NA); can exceed 2^53. }
        assigned: { type: number }
        declined: { type: number }
        totalPd: { type: number, description: Delegatable prefixes (v6). }
        assignedPd: { type: number }

    DHCPSubnet:
      type: object
      required: [id, prefix, pools]
      properties:
        id: { type: integer }
        prefix: { type: string, examples: ["192.0.2.0/24"] }
        sharedNetwork: { type: string }
        pools:
          type: array
          items: { type: string, examples: ["192.0.2.100-192.0.2.199"] }
        pdPools:
          type: array
          items: { type: string, examples: ["2001:db8:8000::/48 → /56"] }
        stats: { $ref: "#/components/schemas/DHCPSubnetStats" }

    DHCPSubnetList:
      type: object
      required: [subnets]
      properties:
        subnets:
          type: array
          items: { $ref: "#/components/schemas/DHCPSubnet" }

    DHCPLease:
      type: object
      required: [ipAddress, subnetId, subnet, state, validLifetime, expires, canDelete]
      properties:
        ipAddress: { type: string }
        type: { type: string, enum: [IA_NA, IA_PD], description: DHCPv6 only. }
        prefixLen: { type: integer }
        hwAddress: { type: string }
        clientId: { type: string }
        duid: { type: string }
        iaid: { type: integer }
        hostname: { type: string }
        subnetId: { type: integer }
        subnet: { type: string }
        state: { type: string, enum: [assigned, declined, expired, released] }
        validLifetime: { type: integer }
        preferredLifetime: { type: integer }
        expires: { type: string, format: date-time }
        canDelete: { type: boolean, description: The user may delete the lease. }

    DHCPLeaseList:
      type: object
      required: [leases, truncated]
      properties:
        leases:
          type: array
          items: { $ref: "#/components/schemas/DHCPLease" }
        truncated: { type: boolean, description: The subnet has more leases than returned. }

    DHCPLeaseDeleteResult:
      type: object
      required: [partners]
      properties:
        partners:
          type: array
          items:
            type: object
            required: [server, done]
            properties:
              server: { type: string }
              done: { type: boolean, description: "false without error: the partner had no such lease." }
              error: { type: string }

    DHCPReservation:
      type: object
      required: [id, version, subnetId, subnet, identifierType, identifier, ipAddresses, source, readOnly]
      properties:
        id: { type: string }
        version: { type: string, description: Send back with an update or delete. }
        subnetId: { type: integer, description: "0: global reservation." }
        subnet: { type: string }
        identifierType: { type: string, examples: [hw-address, duid, client-id] }
        identifier: { type: string }
        ipAddresses:
          type: array
          items: { type: string }
        prefixes:
          type: array
          items: { type: string }
        hostname: { type: string }
        clientClasses:
          type: array
          items: { type: string }
        options: { type: integer, description: Number of option values (not editable in dcdash). }
        source: { type: string, enum: [config, database] }
        readOnly: { type: boolean }

    DHCPReservationList:
      type: object
      required: [reservations]
      properties:
        reservations:
          type: array
          items: { $ref: "#/components/schemas/DHCPReservation" }

    DHCPReservationRequest:
      type: object
      required: [subnetId, identifierType, identifier]
      additionalProperties: false
      properties:
        subnetId: { type: integer, minimum: 0 }
        identifierType:
          type: string
          enum: [hw-address, client-id, duid]
          description: "client-id for DHCPv4, duid for DHCPv6."
        identifier: { type: string, description: "Hex bytes, e.g. aa:bb:cc:dd:ee:ff." }
        ipAddresses:
          type: array
          items: { type: string }
          description: At most one for DHCPv4; within the subnet.
        prefixes:
          type: array
          items: { type: string }
          description: Delegated prefixes (DHCPv6).
        hostname: { type: string }
        version: { type: string, description: Required for updates. }
