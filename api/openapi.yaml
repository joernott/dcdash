openapi: 3.1.0
info:
  title: dcdash API
  description: |
    REST API of dcdash. All endpoints below `/api/v1` return JSON.
    Errors use the `ErrorBody` schema; `error.code` is stable and translated by the frontend.
  version: 0.1.0
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later

tags:
  - name: system
    description: Health and build information
  - name: auth
    description: Login, logout and session information
  - name: me
    description: Settings of the logged-in user
  - name: audit
    description: Audit log
  - name: admin
    description: Administration of sessions and TOTP enrollments
  - name: proxmox
    description: "Proxmox VE clusters: inventory, power actions, tasks and consoles"
  - name: dns
    description: "DNS zones and records in Cloudflare and bind9"
  - name: dhcp
    description: "Kea DHCP servers: subnets, leases and reservations"
  - name: netbox
    description: "NetBox: VLANs, prefixes and free addresses; write-back of changes"
  - name: projects
    description: "Projects: groups of objects with the tag project-<name>"
  - name: firewalls
    description: "OPNsense firewalls: health, VPN, aliases and filter rules"
  - name: directories
    description: "Active Directory domains (Windows and Samba): users, groups and passwords"
  - name: switches
    description: "Aruba CX switches: inventory, health, ports, VLANs and MAC addresses"

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The process is up and serving HTTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [system]
      operationId: getReady
      summary: Readiness probe
      description: Evaluates all registered readiness checks.
      responses:
        "200":
          description: All checks pass.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: At least one check fails.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Build information
      responses:
        "200":
          description: Version of the running server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: State of dcdash's components and backends
      description: |
        For the dashboard; requires a logged-in user. Unlike /readyz it includes components
        whose failure must not take dcdash out of a load balancer, such as the directory.
        Checks run concurrently with a timeout of 5 seconds each.
      responses:
        "200":
          description: The state of every component.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/docs:
    get:
      tags: [system]
      operationId: listDocs
      summary: Pages of the built-in documentation
      description: |
        The documentation is embedded in the binary; requires a logged-in user. The list is in
        menu order and contains no page content.
      responses:
        "200":
          description: The documentation pages.
          content:
            application/json:
              schema:
                type: object
                required: [pages]
                properties:
                  pages:
                    type: array
                    items: { $ref: "#/components/schemas/DocsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/docs/{page}:
    get:
      tags: [system]
      operationId: getDoc
      summary: One page of the built-in documentation, rendered to HTML
      parameters:
        - name: page
          in: path
          required: true
          schema: { type: string }
          example: security
      responses:
        "200":
          description: The page with its HTML.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocsPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with user name and password
      description: |
        Verifies the credentials against the directory and starts a session. The session
        token is set as an HttpOnly cookie; the returned csrfToken must be sent in the
        X-CSRF-Token header of all state-changing requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: Session cookie (__Host-dcdash_session).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400":
          description: "Malformed request, or a user name that is too long or contains control characters (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401":
          description: "Invalid credentials (code: invalid_credentials)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "403":
          description: "Break-glass account without TOTP enrollment (code: totp_not_enrolled)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: "Too many failed attempts (code: too_many_attempts)."
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: "The directory is unavailable (code: directory_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - { session: [], csrf: [] }
      responses:
        "204":
          description: Logged out (also when there was no session).
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401":
          description: "Not logged in (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }


  /api/v1/auth/totp:
    post:
      tags: [auth]
      operationId: verifyTOTP
      summary: Complete the login with a TOTP code or a recovery code
      description: |
        Only in the login step "totp". On success the session is fully authenticated and its
        token is replaced (new cookie). Each code is accepted once; recovery codes are single-use.
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400":
          description: "Neither or both of code and recoveryCode given (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401":
          description: "Wrong, expired or already used code (code: invalid_code), or no session (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "The session is not in the TOTP step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll:
    post:
      tags: [auth]
      operationId: startTOTPEnrollment
      summary: Start a TOTP enrollment
      description: |
        In the login step "totp_enroll", or voluntarily when logged in and not yet enrolled.
        Returns a new secret; it becomes active once confirmed with a code. The break-glass
        account cannot enroll here (it uses `dcdash totp enroll`).
      security:
        - { session: [], csrf: [] }
      responses:
        "200":
          description: The secret to add to an authenticator app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Break-glass account (code: forbidden)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "Already enrolled (code: already_enrolled) or wrong login step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll/confirm:
    post:
      tags: [auth]
      operationId: confirmTOTPEnrollment
      summary: Confirm a TOTP enrollment with a code
      description: |
        Activates the secret and returns recovery codes, which are shown only once. In the login
        step "totp_enroll", the session becomes fully authenticated (new cookie).
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentResult" }
        "401":
          description: "Wrong code (code: invalid_code), or no session (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "No enrollment started (code: no_enrollment), already enrolled (code: already_enrolled) or wrong login step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes
      description: Requires a current TOTP code. The old recovery codes stop working.
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: The new recovery codes, shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401":
          description: "Wrong code (code: invalid_code), or not logged in (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/preferences:
    get:
      tags: [me]
      operationId: getPreferences
      summary: Preferences of the logged-in user
      description: Defaults (browser language, system theme) if the user has not saved any.
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [me]
      operationId: setPreferences
      summary: Save the preferences of the logged-in user
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: The saved preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400":
          description: "Invalid value (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: queryAudit
      summary: Query the audit log
      description: |
        Returns audit entries, newest first. Requires the permission `system:core:audit:read`.
        For the next (older) page, pass `nextBefore` as `before`.
      parameters:
        - { name: actor, in: query, schema: { type: string }, description: "User name (exact, case-insensitive)." }
        - { name: action, in: query, schema: { type: string }, description: 'Action, exact or as a prefix ending with "*" (e.g. "auth.*").' }
        - { name: target, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [success, failure, denied] } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Inclusive. }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: Exclusive. }
        - { name: before, in: query, schema: { type: integer, format: int64, minimum: 1 }, description: Only entries with a lower ID. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Matching entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          description: "Invalid filter (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/sessions:
    get:
      tags: [admin]
      operationId: listSessions
      summary: List active sessions
      description: Requires `system:core:sessions:read`. Newest first; tokens are never returned.
      parameters:
        - { name: username, in: query, schema: { type: string }, description: Only sessions of this user (case-insensitive). }
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/sessions/{id}:
    delete:
      tags: [admin]
      operationId: terminateSession
      summary: Terminate a session
      description: Requires `system:core:sessions:write`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Terminated.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "No such session (code: not_found)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{username}/sessions:
    delete:
      tags: [admin]
      operationId: terminateUserSessions
      summary: Terminate all sessions of a user
      description: Requires `system:core:sessions:write`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Number of terminated sessions.
          content:
            application/json:
              schema:
                type: object
                required: [terminated]
                properties:
                  terminated: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{username}/totp:
    delete:
      tags: [admin]
      operationId: resetTOTP
      summary: Reset the TOTP enrollment of a user
      description: |
        Only for root. Removes the user's TOTP secret and recovery codes; directory users enroll
        again at their next login.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Reset.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "The user has no TOTP enrolled (code: not_found)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters:
    get:
      tags: [proxmox]
      operationId: listProxmoxClusters
      summary: List Proxmox clusters
      description: Returns the clusters on which the user holds at least `read` on any resource.
      responses:
        "200":
          description: Visible clusters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxClusterList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/resources:
    get:
      tags: [proxmox]
      operationId: getProxmoxInventory
      summary: Nodes, guests and storage of a cluster
      description: |
        Only entries the user may read are returned: `node/<name>`, `qemu/<vmid>`, `lxc/<vmid>`
        and `storage/<node>/<storage>` (e.g. `proxmox:lab:qemu/*:read`). Usage values are 0
        when the API token lacks the Proxmox privilege to see them.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
      responses:
        "200":
          description: Inventory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxInventory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}:
    get:
      tags: [proxmox]
      operationId: getProxmoxGuest
      summary: Status and configuration of a guest
      description: Requires `read` on `<type>/<vmid>`. Secrets (cipassword) are removed from the configuration.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      responses:
        "200":
          description: Guest details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxGuestDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [proxmox]
      operationId: deleteProxmoxGuest
      summary: Delete a guest
      description: |
        Requires `admin` on `<type>/<vmid>` and provisioning settings for the cluster. The guest
        must be stopped, and `confirm` must be its name. Deletes the guest with its disks in a
        Proxmox task; poll the task for the result. Audited as `proxmox.guest.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDeleteRequest" }
      responses:
        "202":
          description: Task started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxDeleteResult" }
        "400":
          description: "Invalid request, or the confirmation doesn't match the name (code: confirmation_mismatch)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware:
    get:
      tags: [proxmox]
      operationId: getProxmoxHardware
      summary: Options, disks and network devices of a VM
      description: |
        Requires `read` on `qemu/<vmid>`; VMs only. Includes pending changes (they take effect at
        the next start of the VM) and the digest that changes send back. `configurable` is true if
        the cluster has provisioning settings; changes need `write` on the VM. See
        docs/adr/0005-proxmox-vm-configuration.md.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      responses:
        "200":
          description: The hardware of the VM.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxHardware" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/options:
    post:
      tags: [proxmox]
      operationId: changeProxmoxOptions
      summary: Change, remove or revert options of a VM
      description: |
        Requires `write` on `qemu/<vmid>` and provisioning settings. Only the options listed in
        `ProxmoxOptionSetting.key` can be set or removed; cores, sockets and memory are limited by
        the provisioning settings. `revert` drops pending changes of any key. Audited as
        `proxmox.guest.configure`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxOptionsRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks:
    post:
      tags: [proxmox]
      operationId: createProxmoxDisk
      summary: Add a new disk to a VM
      description: |
        Requires `write` on `qemu/<vmid>` and provisioning settings: the storage must be allowed and
        the size within the disk limit. The disk gets the first free slot of the bus, returned as
        `key`. Audited as `proxmox.disk.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks/{disk}:
    put:
      tags: [proxmox]
      operationId: updateProxmoxDisk
      summary: Grow a disk or change its options
      description: |
        Requires `write` on `qemu/<vmid>`. Disks can only grow, up to the disk limit. Audited as
        `proxmox.disk.resize` (size only) or `proxmox.disk.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskUpdate" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [proxmox]
      operationId: deleteProxmoxDisk
      summary: Delete a disk and its data
      description: |
        Requires `admin` on `qemu/<vmid>`; `confirm` must be the disk key. An unused disk is
        destroyed; an attached disk is detached and destroyed, which is only possible while the VM is
        stopped (code guest_running otherwise). Audited as `proxmox.disk.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400":
          description: "Invalid request, or the confirmation doesn't match the disk (code: confirmation_mismatch)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks/{disk}/detach:
    post:
      tags: [proxmox]
      operationId: detachProxmoxDisk
      summary: Detach a disk; it stays as an unused disk
      description: |
        Requires `write` on `qemu/<vmid>`. Audited as `proxmox.disk.detach`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/disks/{disk}/attach:
    post:
      tags: [proxmox]
      operationId: attachProxmoxDisk
      summary: Attach an unused disk
      description: |
        Requires `write` on `qemu/<vmid>`; `disk` is an unused disk (`unusedN`). It gets the first
        free slot of `bus`, returned as `key`. Audited as `proxmox.disk.attach`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxDisk"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxDiskAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/networks:
    post:
      tags: [proxmox]
      operationId: createProxmoxNetwork
      summary: Add a network device to a VM
      description: |
        Requires `write` on `qemu/<vmid>`; bridge and VLAN must be allowed by the provisioning
        settings. Without `mac` dcdash generates one (prefix BC:24:11). The device gets the first
        free `netN`, returned as `key`. Audited as `proxmox.network.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxNetworkRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/hardware/networks/{net}:
    put:
      tags: [proxmox]
      operationId: updateProxmoxNetwork
      summary: Change a network device; the MAC address stays
      description: |
        Requires `write` on `qemu/<vmid>`. `mac` is ignored. Audited as `proxmox.network.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxNet"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxNetworkRequest" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [proxmox]
      operationId: deleteProxmoxNetwork
      summary: Remove a network device
      description: |
        Requires `write` on `qemu/<vmid>`. Audited as `proxmox.network.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - $ref: "#/components/parameters/ProxmoxNet"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxNetworkAction" }
      responses:
        "200": { $ref: "#/components/responses/ProxmoxChangeDone" }
        "202": { $ref: "#/components/responses/ProxmoxChangeRunning" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/provisioning:
    get:
      tags: [proxmox]
      operationId: getProxmoxProvisioningOptions
      summary: Choices for creating a guest on a node
      description: |
        Requires `admin` on any resource of the cluster and provisioning settings for the
        cluster. Returns what the configuration allows and the node offers: storages, ISO
        images, container templates, bridges, templates the user may read, limits and defaults.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: node, in: query, schema: { type: string }, description: The node; default the first online node. }
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxProvisioningOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests:
    post:
      tags: [proxmox]
      operationId: createProxmoxGuest
      summary: Create a VM or container
      description: |
        Requires `admin` on the new `<type>/<vmid>`, `read` on a cloned template, and
        provisioning settings for the cluster, which limit the request. Starts a job that runs
        the steps (clone, configure, resize, create, start) in the background; poll the job.
        Audited as `proxmox.guest.create` when the job ends.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProxmoxCreateRequest" }
      responses:
        "202":
          description: Job started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxJob" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxConflict" }
        "429":
          description: "The user runs 3 creations, or dcdash 20, already (code: too_many_jobs)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/jobs/{id}:
    get:
      tags: [proxmox]
      operationId: getProxmoxJob
      summary: State of a creation job
      description: |
        Visible to the user who started it and to users with `read` on the new guest. Jobs are
        kept in memory for an hour after they end.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/actions/{action}:
    post:
      tags: [proxmox]
      operationId: runProxmoxAction
      summary: Run a power action
      description: |
        Requires `operate` on `<type>/<vmid>`. Starts a Proxmox task and returns its ID; poll the
        task for the result. Audited as `proxmox.guest.<action>`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, shutdown, stop, reboot, suspend, resume] }
      responses:
        "202":
          description: Task started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxTaskRef" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/tasks/{upid}:
    get:
      tags: [proxmox]
      operationId: getProxmoxTask
      summary: Status and log of a task
      description: |
        Requires `read` on the task's guest (`qemu/<id>` or `lxc/<id>`), or on `node/<node>` for
        tasks without a guest.
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: upid, in: path, required: true, schema: { type: string }, description: Proxmox task ID (UPID). }
        - { name: log, in: query, schema: { type: string }, description: "Any value: include the log (up to 500 lines)." }
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxTask" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/console:
    post:
      tags: [proxmox]
      operationId: openProxmoxGuestConsole
      summary: Prepare the console of a guest
      description: |
        Requires `console` on `<type>/<vmid>`. Virtual machines get a VNC console (noVNC),
        containers a terminal (xterm.js). Terminals need a console user in the cluster
        configuration (409 otherwise). Open the websocket `/api/v1/proxmox/console/{id}` within
        15 seconds.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - $ref: "#/components/parameters/ProxmoxGuestType"
        - $ref: "#/components/parameters/ProxmoxVMID"
      responses:
        "200":
          description: Console prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConsoleTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Terminals need a console user in the cluster configuration (code: terminal_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/TooManyConsoles" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/nodes/{node}/shell:
    post:
      tags: [proxmox]
      operationId: openProxmoxNodeShell
      summary: Prepare a shell on a node
      description: |
        A node shell is root access to the hypervisor, so it requires `admin` on `node/<node>`.
        Open the websocket `/api/v1/proxmox/console/{id}` within 15 seconds.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/ProxmoxCluster"
        - { name: node, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Shell prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxmoxConsoleTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Terminals need a console user in the cluster configuration (code: terminal_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/TooManyConsoles" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/console/{id}:
    get:
      tags: [proxmox]
      operationId: connectProxmoxConsole
      summary: Console websocket
      description: |
        Websocket (subprotocol `binary`) proxied to Proxmox. The ticket is valid once, for 15
        seconds, and only for the session that prepared it. VNC consoles speak RFB (password:
        `ProxmoxConsoleTicket.password`); terminals speak the Proxmox termproxy protocol
        (`0:<length>:<data>` input, `1:<cols>:<rows>:` resize, `2` ping), the login is done by
        dcdash. The connection ends when the dcdash session ends. Start and end are audited.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "101":
          description: Switching to the websocket protocol.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers:
    get:
      tags: [dns]
      operationId: listDNSProviders
      summary: List DNS providers
      description: Returns the providers on which the user holds at least `read` on any zone.
      responses:
        "200":
          description: Visible providers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSProviderList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones:
    get:
      tags: [dns]
      operationId: listDNSZones
      summary: List the zones of a provider
      description: Only zones the user may read are returned (`dns:<provider>:<zone>:read`).
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
      responses:
        "200":
          description: Zones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZoneList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [dns]
      operationId: createDNSZone
      summary: Create a zone
      description: |
        Requires `admin` on the zone. bind9: uploads the zone file over SFTP, adds the zone with
        rndc addzone and lists it in the catalog zone. Cloudflare: creates a "pending" zone; the
        registrar must delegate it to the returned name servers. Audited as `dns.zone.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSZoneRequest" }
      responses:
        "201":
          description: Zone created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZone" }
        "400": { $ref: "#/components/responses/DNSInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones/{zone}:
    delete:
      tags: [dns]
      operationId: deleteDNSZone
      summary: Delete a zone
      description: |
        Requires `admin` on the zone and the zone name repeated in `confirm`. bind9 can delete
        only zones of the catalog zone (zones created by dcdash), not zones from named.conf.
        Audited as `dns.zone.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
        - { name: confirm, in: query, required: true, schema: { type: string }, description: The zone name again. }
      responses:
        "204": { description: Zone deleted. }
        "400":
          description: "The confirmation is missing or wrong (code: confirmation_required)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones/{zone}/records:
    get:
      tags: [dns]
      operationId: listDNSRecords
      summary: List the records of a zone
      description: Requires `read` on the zone.
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
      responses:
        "200":
          description: Records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecordSet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [dns]
      operationId: createDNSRecord
      summary: Create a record
      description: |
        Requires `write` on the zone. `version` is the version of the record set. Audited as
        `dns.record.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordRequest" }
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecord" }
        "400": { $ref: "#/components/responses/DNSInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "422": { $ref: "#/components/responses/DNSRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dns/providers/{provider}/zones/{zone}/records/{id}:
    put:
      tags: [dns]
      operationId: updateDNSRecord
      summary: Replace a record
      description: |
        Requires `write` on the zone. `version` is the version of the record as read. For bind9
        the ID changes when the name, type or content changes. Audited as `dns.record.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
        - $ref: "#/components/parameters/DNSRecordID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordRequest" }
      responses:
        "200":
          description: Record replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecord" }
        "400": { $ref: "#/components/responses/DNSInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "422": { $ref: "#/components/responses/DNSRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [dns]
      operationId: deleteDNSRecord
      summary: Delete a record
      description: Requires `write` on the zone. Audited as `dns.record.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DNSProvider"
        - $ref: "#/components/parameters/DNSZone"
        - $ref: "#/components/parameters/DNSRecordID"
        - { name: version, in: query, required: true, schema: { type: string }, description: Version of the record as read. }
      responses:
        "204": { description: Record deleted. }
        "200":
          description: Record deleted; the A or AAAA record was written to NetBox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxWriteBack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DNSConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers:
    get:
      tags: [dhcp]
      operationId: listDHCPServers
      summary: List DHCP servers
      description: |
        Returns the Kea servers on which the user holds at least `read` on any subnet, with
        their state, capabilities (from the loaded hook libraries) and HA state.
      responses:
        "200":
          description: Visible servers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPServerList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/subnets:
    get:
      tags: [dhcp]
      operationId: listDHCPSubnets
      summary: List the subnets of a server
      description: |
        Only subnets the user may read are returned (`dhcp:<server>:<prefix>:read`). Pools need
        the subnet_cmds hook, statistics the stat_cmds hook.
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
      responses:
        "200":
          description: Subnets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPSubnetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/leases:
    get:
      tags: [dhcp]
      operationId: listDHCPLeases
      summary: List or search leases
      description: |
        Either the leases of one subnet (`subnet`, at most 5000) or a search (`by` and `q`).
        Only leases of readable subnets are returned. Needs the lease_cmds hook.
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - { name: subnet, in: query, schema: { type: integer, minimum: 1 }, description: Subnet ID. }
        - name: by
          in: query
          schema: { type: string, enum: [ip, hw-address, client-id, duid, hostname] }
          description: Search key; the server's searchKeys lists those of its family.
        - { name: q, in: query, schema: { type: string }, description: Search value. }
      responses:
        "200":
          description: Leases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPLeaseList" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/leases/{ip}:
    delete:
      tags: [dhcp]
      operationId: deleteDHCPLease
      summary: Delete a lease
      description: |
        Requires `operate` on the lease's subnet. Kea doesn't pass this change to an HA partner,
        so dcdash deletes the lease on the other servers of the HA group too and reports the
        result per partner. Audited as `dhcp.lease.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - { name: ip, in: path, required: true, schema: { type: string }, description: Address or delegated prefix. }
        - { name: type, in: query, schema: { type: string, enum: [IA_NA, IA_PD] }, description: "DHCPv6: lease type (default IA_NA)." }
      responses:
        "200":
          description: Lease deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPLeaseDeleteResult" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/reservations:
    get:
      tags: [dhcp]
      operationId: listDHCPReservations
      summary: List reservations
      description: |
        Reservations from the configuration file (read-only) and the host database, of all
        readable subnets or of one subnet. Needs the host_cmds hook.
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - { name: subnet, in: query, schema: { type: integer, minimum: 0 }, description: "Subnet ID; 0 for global reservations." }
      responses:
        "200":
          description: Reservations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPReservationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [dhcp]
      operationId: createDHCPReservation
      summary: Add a reservation
      description: |
        Requires `write` on the subnet and a host database: on this server, or on a partner of
        its HA group (the partners share the host database). Audited as
        `dhcp.reservation.create`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DHCPReservationRequest" }
      responses:
        "201":
          description: Reservation added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPReservation" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "422": { $ref: "#/components/responses/DHCPRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/dhcp/servers/{server}/reservations/{id}:
    put:
      tags: [dhcp]
      operationId: updateDHCPReservation
      summary: Change a reservation
      description: |
        Requires `write` on the subnet. Subnet and identifier can't change. Client classes,
        options and boot fields are kept. Audited as `dhcp.reservation.update`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - $ref: "#/components/parameters/DHCPReservationID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DHCPReservationRequest" }
      responses:
        "200":
          description: Reservation changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DHCPReservation" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "422": { $ref: "#/components/responses/DHCPRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [dhcp]
      operationId: deleteDHCPReservation
      summary: Delete a reservation
      description: Requires `write` on the subnet. Audited as `dhcp.reservation.delete`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - $ref: "#/components/parameters/DHCPServer"
        - $ref: "#/components/parameters/DHCPReservationID"
        - { name: version, in: query, required: true, schema: { type: string }, description: Version of the reservation as read. }
      responses:
        "204": { description: Reservation deleted. }
        "200":
          description: Reservation deleted and written to NetBox.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxWriteBack" }
        "400": { $ref: "#/components/responses/DHCPInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DHCPConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/netbox:
    get:
      tags: [netbox]
      operationId: getNetBox
      summary: NetBox connection
      description: |
        Returns the name of the NetBox instance (the permission segment of
        `netbox:<name>:<resource>:<action>`), whether changes are written back, and the Proxmox
        clusters that are mapped to NetBox clusters. Any logged-in user may read it. 404 if
        NetBox isn't configured.
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/netbox/vlans/{vid}:
    get:
      tags: [netbox]
      operationId: getNetBoxVLAN
      summary: A VLAN with its prefixes and free addresses
      description: |
        Looks up the VLAN with that VLAN ID in NetBox (in the configured VLAN group or site) and
        returns its prefixes in the configured VRF, each with up to 8 free addresses. Used by
        the creation wizard. Needs `netbox:<name>:ipam:read`.
      parameters:
        - name: vid
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 4094 }
      responses:
        "200":
          description: The VLAN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxVLAN" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/netbox/compare/guests/{cluster}:
    get:
      tags: [netbox]
      operationId: compareNetBoxGuests
      summary: Compare the guests of a cluster with NetBox
      description: |
        Compares the guests of a Proxmox cluster with the VMs of the mapped NetBox cluster:
        name, vCPUs, memory, disks, interfaces (MAC address, VLAN) and static addresses. Needs
        `netbox:<name>:sync:read`; guests are listed only if the user may read them in the
        Proxmox module. VMs that exist only in NetBox are listed with the state `extra`.
      parameters:
        - { name: cluster, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxGuestComparison" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/netbox/compare/guests/{cluster}/{type}/{vmid}:
    post:
      tags: [netbox]
      operationId: applyNetBoxGuest
      summary: Write a guest to NetBox
      description: |
        Writes the current state of a guest to NetBox (creates or updates the VM, its disks,
        interfaces and addresses). Needs `netbox:<name>:sync:write` and read access to the
        guest. Audited as `netbox.apply`.
      parameters:
        - { name: cluster, in: path, required: true, schema: { type: string } }
        - { name: type, in: path, required: true, schema: { type: string, enum: [qemu, lxc] } }
        - { name: vmid, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The result; a failed write-back has the status `failed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxWriteBack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/netbox/compare/guests/{cluster}/vms/{id}:
    delete:
      tags: [netbox]
      operationId: deleteNetBoxVM
      summary: Delete a VM that exists only in NetBox
      description: |
        Deletes a NetBox VM of the mapped cluster that has the dcdash tag and no guest in
        Proxmox (codes `not_tagged`, `guest_exists` otherwise). Needs `netbox:<name>:sync:write`.
        Audited as `netbox.apply`.
      parameters:
        - { name: cluster, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxWriteBack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/netbox/compare/addresses:
    get:
      tags: [netbox]
      operationId: compareNetBoxAddresses
      summary: Compare DHCP reservations and DNS records with NetBox
      description: |
        Lists reserved addresses that are missing in NetBox, and A/AAAA records whose address
        is missing in NetBox or has another DNS name there. Needs `netbox:<name>:sync:read`.
        Sources that couldn't be read are listed in `errors`.
      responses:
        "200":
          description: The comparison.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetBoxAddressComparison" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/proxmox/clusters/{cluster}/guests/{type}/{vmid}/projects:
    put:
      tags: [proxmox]
      operationId: setGuestProjects
      summary: Set the projects of a guest
      description: |
        Replaces the projects of a guest, its Proxmox tags `project-<name>`; other tags are kept.
        Needs `write` on the guest and `project:<name>:objects:write` on every added and
        removed project. The guest is then written to NetBox. Audited as `project.assign` and
        `project.unassign`.
      parameters:
        - { name: cluster, in: path, required: true, schema: { type: string } }
        - { name: type, in: path, required: true, schema: { type: string, enum: [qemu, lxc] } }
        - { name: vmid, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projects]
              properties:
                projects: { type: array, items: { type: string } }
      responses:
        "200":
          description: The projects of the guest.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { type: string } }
                  netbox: { $ref: "#/components/schemas/NetBoxResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ProxmoxChangeConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/netbox/addresses/{address}/projects:
    get:
      tags: [netbox]
      operationId: getNetBoxAddressProjects
      summary: Projects of an address in NetBox
      description: The projects of the NetBox address, for the DHCP and DNS dialogs. Any logged-in user.
      parameters:
        - { name: address, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The projects (names), empty if the address isn't in NetBox.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/switches:
    get:
      tags: [switches]
      operationId: listSwitches
      summary: List switches
      description: |
        Returns the switches on which the user holds at least `read` on any resource
        (`switch:<name>:*:read`), with their inventory. The inventory is cached for a minute;
        switches are read in parallel.
      responses:
        "200":
          description: Visible switches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/switches/{switch}/ports:
    get:
      tags: [switches]
      operationId: listSwitchPorts
      summary: List the ports of a switch
      description: |
        Physical ports and LAGs with state, speed, VLANs, LLDP neighbors and PoE, plus the
        switch's VLANs. Only ports the user may read are listed
        (`switch:<switch>:port/<port>:read`). With `switches[].netbox_device` and NetBox, each
        port carries its NetBox interface and projects.
      parameters:
        - $ref: "#/components/parameters/SwitchName"
      responses:
        "200":
          description: The ports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchPortList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/switches/{switch}/ports/{port}:
    put:
      tags: [switches]
      operationId: updateSwitchPort
      summary: Change a port
      description: |
        Changes the given fields of a port and saves the configuration to the startup
        configuration. Enabling and disabling alone needs `switch:<switch>:port/<port>:operate`,
        everything else `write`. Audited as `switch.port.update`. A failed save is returned
        as `saveError`; the change stays in the running configuration.
      parameters:
        - $ref: "#/components/parameters/SwitchName"
        - { name: port, in: path, required: true, schema: { type: string }, description: "Port name, slashes URL-encoded (1%2F1%2F5)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchPortUpdate" }
      responses:
        "200":
          description: The changed port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchPortResult" }
        "400": { $ref: "#/components/responses/SwitchInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/SwitchRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/switches/{switch}/vlans:
    get:
      tags: [switches]
      operationId: listSwitchVLANs
      summary: List the VLANs of a switch
      description: The VLANs with the ports that use them. Needs `read` on any resource of the switch.
      parameters:
        - $ref: "#/components/parameters/SwitchName"
      responses:
        "200":
          description: The VLANs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchVLANList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [switches]
      operationId: createSwitchVLAN
      summary: Create a VLAN
      description: |
        Creates a VLAN (2 to 4094) and saves the configuration. Needs
        `switch:<switch>:vlan/<id>:write`. Audited as `switch.vlan.create`.
      parameters:
        - $ref: "#/components/parameters/SwitchName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchVLANRequest" }
      responses:
        "201":
          description: The VLAN was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchVLANResult" }
        "400": { $ref: "#/components/responses/SwitchInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SwitchConflict" }
        "422": { $ref: "#/components/responses/SwitchRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/switches/{switch}/vlans/{id}:
    put:
      tags: [switches]
      operationId: renameSwitchVLAN
      summary: Rename a VLAN
      description: Needs `switch:<switch>:vlan/<id>:write`. Audited as `switch.vlan.update`.
      parameters:
        - $ref: "#/components/parameters/SwitchName"
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchVLANRequest" }
      responses:
        "200":
          description: The VLAN was renamed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchVLANResult" }
        "400": { $ref: "#/components/responses/SwitchInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/SwitchRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [switches]
      operationId: deleteSwitchVLAN
      summary: Delete a VLAN
      description: |
        Deletes a VLAN that no port uses and saves the configuration. VLAN 1 cannot be
        deleted. Needs `switch:<switch>:vlan/<id>:write`. Audited as `switch.vlan.delete`.
      parameters:
        - $ref: "#/components/parameters/SwitchName"
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The VLAN was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchVLANResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/SwitchConflict" }
        "422": { $ref: "#/components/responses/SwitchRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/switches/macs:
    get:
      tags: [switches]
      operationId: searchSwitchMACs
      summary: Find a MAC address on all switches
      description: |
        Searches the MAC address tables of all switches the user may see for a (partial) MAC
        address. Results on ports the user may not read are left out. Access ports come first:
        there the device is connected; on uplinks the device is behind another switch.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: "At least 4 hex digits; colons, dashes and dots are ignored.", examples: [bc:24:11] }
      responses:
        "200":
          description: The hits and the switches that could not be searched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchMACSearch" }
        "400": { $ref: "#/components/responses/SwitchInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls:
    get:
      tags: [firewalls]
      operationId: listFirewalls
      summary: List firewalls
      description: |
        Returns the firewalls on which the user holds at least `read` on any resource
        (`firewall:<name>:*:read`), with version, uptime and memory. Cached for a minute.
      responses:
        "200":
          description: Visible firewalls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/health:
    get:
      tags: [firewalls]
      operationId: getFirewallHealth
      summary: Gateways and services of a firewall
      description: Needs `firewall:<firewall>:system:read`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
      responses:
        "200":
          description: The health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/services/restart:
    post:
      tags: [firewalls]
      operationId: restartFirewallService
      summary: Restart a service
      description: Needs `firewall:<firewall>:system:operate`. Audited as `firewall.service.restart`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Service ID from the health response. }
      responses:
        "204": { description: The service was restarted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/vpn:
    get:
      tags: [firewalls]
      operationId: getFirewallVPN
      summary: WireGuard peers and IPsec tunnels
      description: |
        Peers and tunnels the user may read (`wireguard/<peer>`, `ipsec/<connection>`). A
        part the firewall doesn't offer, or the API user may not read, is named in `errors`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
      responses:
        "200":
          description: The VPN state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallVPN" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/wireguard/{uuid}:
    put:
      tags: [firewalls]
      operationId: setFirewallPeer
      summary: Enable or disable a WireGuard peer
      description: |
        Changes the peer and applies the WireGuard configuration. Needs
        `firewall:<firewall>:wireguard/<peer name>:operate`. Audited as `firewall.wireguard.update`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
        - { name: uuid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The peer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallPeer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/ipsec/{name}/restart:
    post:
      tags: [firewalls]
      operationId: restartFirewallTunnel
      summary: Restart an IPsec tunnel
      description: |
        Disconnects and connects the connection; connecting is asynchronous. Needs
        `firewall:<firewall>:ipsec/<name>:operate`. Audited as `firewall.ipsec.restart`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: The tunnel is being restarted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/aliases:
    get:
      tags: [firewalls]
      operationId: listFirewallAliases
      summary: List aliases
      description: Aliases the user may read (`firewall:<firewall>:alias/<name>:read`).
      parameters:
        - $ref: "#/components/parameters/FirewallName"
      responses:
        "200":
          description: The aliases.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallAliasList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [firewalls]
      operationId: createFirewallAlias
      summary: Create an alias
      description: |
        Creates the alias and applies the aliases. Needs `firewall:<firewall>:alias/<name>:write`.
        Audited as `firewall.alias.create`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirewallAliasRequest" }
      responses:
        "201":
          description: The alias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallAlias" }
        "400": { $ref: "#/components/responses/FirewallInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/FirewallRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/aliases/{uuid}:
    put:
      tags: [firewalls]
      operationId: updateFirewallAlias
      summary: Change an alias
      description: |
        A rename needs `write` on the old and the new name. Audited as `firewall.alias.update`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
        - { name: uuid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirewallAliasRequest" }
      responses:
        "200":
          description: The alias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallAlias" }
        "400": { $ref: "#/components/responses/FirewallInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/FirewallConflict" }
        "422": { $ref: "#/components/responses/FirewallRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [firewalls]
      operationId: deleteFirewallAlias
      summary: Delete an alias
      description: OPNsense refuses aliases in use (422). Audited as `firewall.alias.delete`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: The alias was deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/FirewallRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/rules:
    get:
      tags: [firewalls]
      operationId: listFirewallRules
      summary: List filter rules
      description: |
        Rules of the interfaces the user may read (`firewall:<firewall>:rule/<interface>:read`),
        in their order. Legacy and automatic rules are read-only.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRuleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [firewalls]
      operationId: createFirewallRule
      summary: Create a filter rule
      description: |
        Creates the rule with a savepoint: dcdash applies it, checks over a new connection that
        it still reaches the firewall and only then keeps it. Otherwise OPNsense restores the
        previous rules within a minute (`rolledBack`). Needs
        `firewall:<firewall>:rule/<interface>:write`. Audited as `firewall.rule.create`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirewallRuleRequest" }
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRuleResult" }
        "400": { $ref: "#/components/responses/FirewallInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/FirewallConflict" }
        "422": { $ref: "#/components/responses/FirewallRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/firewalls/{firewall}/rules/{uuid}:
    put:
      tags: [firewalls]
      operationId: updateFirewallRule
      summary: Change a filter rule
      description: |
        Like creating; moving a rule to another interface needs `write` on both. Audited as
        `firewall.rule.update`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
        - { name: uuid, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirewallRuleRequest" }
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRuleResult" }
        "400": { $ref: "#/components/responses/FirewallInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/FirewallConflict" }
        "422": { $ref: "#/components/responses/FirewallRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [firewalls]
      operationId: deleteFirewallRule
      summary: Delete a filter rule
      description: With a savepoint, like creating. Audited as `firewall.rule.delete`.
      parameters:
        - $ref: "#/components/parameters/FirewallName"
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRuleResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/FirewallConflict" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List the projects
      description: |
        The projects the user may read (`project:<name>:objects:read`). Users with access to all
        projects also get the state: invalid project files, tag synchronization errors and
        orphaned tags.
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/projects/{name}:
    get:
      tags: [projects]
      operationId: getProject
      summary: A project with its objects
      description: |
        The project with its Proxmox guests (from all clusters; guests the user may not read are
        listed without node and status) and its NetBox objects by type. Sources that can't be
        read are listed in `errors`. Needs `project:<name>:objects:read`.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/projects/{name}/search:
    get:
      tags: [projects]
      operationId: searchProjectObjects
      summary: Search NetBox objects to add to a project
      description: Searches NetBox objects of a type (up to 25). Needs `project:<name>:objects:write`.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { $ref: "#/components/schemas/ProjectObjectType" } }
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Matching objects.
          content:
            application/json:
              schema:
                type: object
                required: [objects]
                properties:
                  objects: { type: array, items: { $ref: "#/components/schemas/ProjectObject" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/projects/{name}/objects:
    post:
      tags: [projects]
      operationId: addProjectObject
      summary: Add a NetBox object to a project
      description: |
        Adds the project's tag to a NetBox object. Needs `project:<name>:objects:write`. Audited as
        `project.assign`. Guests are assigned through their projects (Proxmox tags).
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { $ref: "#/components/schemas/ProjectObjectType" }
                id: { type: integer, format: int64 }
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectObject" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/projects/{name}/objects/{type}/{id}:
    delete:
      tags: [projects]
      operationId: removeProjectObject
      summary: Remove a NetBox object from a project
      description: Removes the project's tag from a NetBox object. Audited as `project.unassign`.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: type, in: path, required: true, schema: { $ref: "#/components/schemas/ProjectObjectType" } }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectObject" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories:
    get:
      tags: [directories]
      operationId: listDirectories
      summary: List directories
      description: |
        Returns the Active Directory domains on which the user holds at least `read` on any
        resource (`directory:<name>:*:read`).
      responses:
        "200":
          description: Visible directories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/containers:
    get:
      tags: [directories]
      operationId: listDirectoryContainers
      summary: Containers users and groups can be created in
      description: The organizational units and containers below `managed_ous`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
      responses:
        "200":
          description: The containers, parents before their children.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryContainerList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/policy:
    get:
      tags: [directories]
      operationId: getDirectoryPolicy
      summary: Password policy of the domain
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
      responses:
        "200":
          description: The password policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryPasswordPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/users:
    get:
      tags: [directories]
      operationId: listDirectoryUsers
      summary: List users
      description: Users the user may read (`directory:<directory>:user/<name>:read`), sorted by account name.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryQuery"
        - $ref: "#/components/parameters/DirectoryLimit"
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUserList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [directories]
      operationId: createDirectoryUser
      summary: Create a user
      description: |
        Creates the user with a password in a managed container. Needs
        `directory:<directory>:user/<name>:write`. Audited as `directory.user.create` (without
        the password).
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryNewUser" }
      responses:
        "201":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUser" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DirectoryExists" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/users/{name}:
    get:
      tags: [directories]
      operationId: getDirectoryUser
      summary: A user
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [directories]
      operationId: updateDirectoryUser
      summary: Change a user
      description: |
        Changes the given attributes; an empty string removes one. Needs `write` on the user
        (and `admin` if it is protected); the user must be in a managed container. Audited as
        `directory.user.update`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryUserChange" }
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUser" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [directories]
      operationId: deleteDirectoryUser
      summary: Delete a user
      description: Needs `write` on the user. Audited as `directory.user.delete`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      responses:
        "204": { description: The user was deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/users/{name}/enable:
    post:
      tags: [directories]
      operationId: enableDirectoryUser
      summary: Enable a user
      description: Needs `operate` on the user. Audited as `directory.user.enable`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/users/{name}/disable:
    post:
      tags: [directories]
      operationId: disableDirectoryUser
      summary: Disable a user
      description: Disabled users can't log in. Needs `operate` on the user. Audited as `directory.user.disable`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/users/{name}/unlock:
    post:
      tags: [directories]
      operationId: unlockDirectoryUser
      summary: Unlock a user
      description: Clears a lockout caused by failed logins. Needs `operate` on the user. Audited as `directory.user.unlock`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/users/{name}/password:
    post:
      tags: [directories]
      operationId: resetDirectoryUserPassword
      summary: Reset a user's password
      description: |
        Sets a new password (an administrative reset, without the old one). Needs `operate` on
        the user. Audited as `directory.user.password` (without the password).
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryPasswordReset" }
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryUser" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/groups:
    get:
      tags: [directories]
      operationId: listDirectoryGroups
      summary: List groups
      description: Groups the user may read (`directory:<directory>:group/<name>:read`), without members.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryQuery"
        - $ref: "#/components/parameters/DirectoryLimit"
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryGroupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [directories]
      operationId: createDirectoryGroup
      summary: Create a group
      description: Needs `directory:<directory>:group/<name>:write`. Audited as `directory.group.create`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryNewGroup" }
      responses:
        "201":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryGroup" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DirectoryExists" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/groups/{name}:
    get:
      tags: [directories]
      operationId: getDirectoryGroup
      summary: A group with its direct members
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [directories]
      operationId: updateDirectoryGroup
      summary: Change or rename a group
      description: |
        A rename needs `write` on the old and the new name. AD allows changing a global or
        domain local group only to universal and back (422 otherwise). Audited as
        `directory.group.update`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryGroupChange" }
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryGroup" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/DirectoryExists" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [directories]
      operationId: deleteDirectoryGroup
      summary: Delete a group
      description: Needs `write` on the group. Audited as `directory.group.delete`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      responses:
        "204": { description: The group was deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/directories/{directory}/groups/{name}/members:
    post:
      tags: [directories]
      operationId: changeDirectoryGroupMembers
      summary: Add and remove members
      description: |
        Adds and removes direct members by account name (users, groups, computers). Adding a
        member twice or removing a non-member is no error. Needs `write` on the group. Audited
        as `directory.group.members`.
      parameters:
        - $ref: "#/components/parameters/DirectoryName"
        - $ref: "#/components/parameters/DirectoryAccount"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryMembersChange" }
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryGroup" }
        "400": { $ref: "#/components/responses/DirectoryInvalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/DirectoryRejected" }
        "502": { $ref: "#/components/responses/Upstream" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/password/directories:
    get:
      tags: [directories]
      operationId: listSelfServiceDirectories
      summary: Directories for the self-service password change
      description: |
        No login needed. The directories with `self_service` and their password policy (left
        out if the directory can't be reached). 404 if the self-service is off.
      security: []
      responses:
        "200":
          description: The directories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfServiceDirectoryList" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/password/change:
    post:
      tags: [directories]
      operationId: changeOwnPassword
      summary: Change one's password (self-service)
      description: |
        No login and no CSRF token needed (the origin and JSON checks apply). Changes the
        password with the current one, also for users who must change it. Unknown users and
        wrong passwords get the same answer (invalid_credentials), which takes at least a
        second. Failures are limited per user and per client address like logins
        (`auth.lockout`). Audited as `directory.password.change` with the user as actor
        (source `self-service`), without the passwords.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfServicePasswordChange" }
      responses:
        "204": { description: The password was changed. }
        "400":
          description: "Invalid request (invalid_request) or the same password twice (same_password)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401":
          description: "The user name or the current password is wrong (invalid_credentials)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: |
            The password policy rejected the new password: password_policy_tooShort,
            password_policy_history, password_policy_tooYoung, password_policy_complexity or
            password_policy_policy (Windows doesn't say why), with the domain controller's
            message; or rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: "Too many failed attempts (too_many_attempts); see Retry-After."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: "The directory is not available (directory_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-dcdash_session
      description: Session cookie, set by login.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The csrfToken of the session (returned by login and GET /api/v1/auth/me). Required for
        all state-changing requests of a session.

  parameters:
    ProxmoxCluster: { name: cluster, in: path, required: true, schema: { type: string }, description: Cluster name from the configuration. }
    ProxmoxGuestType: { name: type, in: path, required: true, schema: { type: string, enum: [qemu, lxc] } }
    ProxmoxVMID: { name: vmid, in: path, required: true, schema: { type: integer, minimum: 1 } }
    ProxmoxDisk: { name: disk, in: path, required: true, schema: { type: string, pattern: "^(scsi|virtio|sata|ide|unused)[0-9]+$" }, description: "Disk key, e.g. scsi1 or unused0." }
    ProxmoxNet: { name: net, in: path, required: true, schema: { type: string, pattern: "^net[0-9]+$" }, description: "Network device key, e.g. net1." }

    DNSProvider: { name: provider, in: path, required: true, schema: { type: string }, description: Provider name from the configuration. }
    DNSZone: { name: zone, in: path, required: true, schema: { type: string }, description: Zone name without trailing dot. }
    DNSRecordID: { name: id, in: path, required: true, schema: { type: string } }

    FirewallName: { name: firewall, in: path, required: true, schema: { type: string }, description: Firewall name from the configuration. }
    DirectoryName: { name: directory, in: path, required: true, schema: { type: string }, description: Directory name from the configuration. }
    DirectoryAccount: { name: name, in: path, required: true, schema: { type: string }, description: Account name (sAMAccountName). }
    DirectoryQuery: { name: q, in: query, schema: { type: string }, description: "Only objects whose account name, names, mail address or description contain this text." }
    DirectoryLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 500 } }
    SwitchName: { name: switch, in: path, required: true, schema: { type: string }, description: Switch name from the configuration. }
    DHCPServer: { name: server, in: path, required: true, schema: { type: string }, description: Server name from the configuration. }
    DHCPReservationID: { name: id, in: path, required: true, schema: { type: string }, description: The id of the reservation as listed. }
  responses:
    DirectoryInvalid:
      description: "Invalid request: invalid_request, invalid_user, invalid_group, invalid_password or invalid_members, with the reason as message."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DirectoryExists:
      description: "A user or group with the account name exists (exists)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DirectoryRejected:
      description: "The domain controller rejected the change: password_policy (with the reason, e.g. too short, in the history, too young) or rejected (with its message)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FirewallInvalid:
      description: "Invalid request: invalid_request, invalid_alias or invalid_rule, with the reason as message."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FirewallConflict:
      description: "The alias type is read-only (alias_read_only); on a firewall without savepoints, the rule could cut dcdash off (protected_rule), or dcdash can't tell which interface it reaches the firewall through (guard_unknown)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    FirewallRejected:
      description: "OPNsense rejected the change (rejected), with its messages."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    SwitchInvalid:
      description: "Invalid request: invalid_request, invalid_port, invalid_vlan or invalid_query, with the reason as message."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    SwitchConflict:
      description: "The VLAN exists (exists), is used by ports (vlan_in_use) or is VLAN 1 (default_vlan)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    SwitchRejected:
      description: "The switch rejected the change (rejected), with its message."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DHCPInvalid:
      description: "Invalid reservation (code: invalid_reservation, with the reason as message) or request (invalid_request)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DHCPConflict:
      description: |
        Codes: conflict (changed since it was read, or Kea reports a conflict), read_only (the
        reservation is in the configuration file), unsupported (the server lacks the hook
        library or the host database).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DHCPRejected:
      description: "Kea rejected the change, e.g. a duplicate reservation (code: rejected, with Kea's message)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DNSInvalid:
      description: "Invalid record or zone (code: invalid_record, with the reason as message) or body (invalid_request)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DNSConflict:
      description: |
        Codes: conflict (changed since it was read, reload and try again), exists (the record or
        zone exists already), unsupported (the provider can't create or delete zones).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    DNSRejected:
      description: "The server accepted the update but didn't apply it, e.g. a CNAME next to other records (code: rejected)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: "Not found (code: not_found)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ProxmoxChangeDone:
      description: The change is done.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProxmoxConfigResult" }
    ProxmoxChangeRunning:
      description: The Proxmox task was still running after 60 seconds; the task list shows its end.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProxmoxConfigResult" }
    ProxmoxChangeConflict:
      description: |
        Codes: provisioning_disabled (the cluster has no provisioning settings), config_changed
        (the configuration changed since it was read: reload and try again), no_free_slot (no free
        slot on the bus), guest_running (stop the VM or detach the disk first).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    ProxmoxConflict:
      description: |
        Codes: provisioning_disabled (the cluster has no provisioning settings),
        vmid_taken (the requested ID is in use), no_free_vmid (no free ID of the range may be
        used by the user),
        guest_running (stop the guest before deleting it).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Upstream:
      description: |
        The backend failed. Codes: upstream_unavailable (not reachable), upstream_forbidden
        (the backend denied the request, e.g. missing privileges of the API token), upstream_error
        (message from the backend).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    TooManyConsoles:
      description: "The session is already preparing 3 consoles that were not opened yet (code: too_many_consoles)."
      headers:
        Retry-After:
          description: Seconds until a console can be prepared again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    TooManyAttempts:
      description: "Too many failed attempts (code: too_many_attempts)."
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: "Not logged in (code: not_authenticated)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: "Permission denied (code: forbidden)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 256 }
        password: { type: string, format: password }

    SessionInfo:
      type: object
      required: [user, stage, csrfToken, expiresAt, roles, permissions, totp]
      properties:
        user: { $ref: "#/components/schemas/UserInfo" }
        stage:
          type: string
          enum: [authenticated, totp, totp_enroll]
          description: |
            authenticated: fully logged in; totp: a TOTP or recovery code is still required;
            totp_enroll: the user must enroll TOTP first. Pending steps expire after 10 minutes.
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time, description: Absolute end of the session. }
        roles:
          type: array
          items: { type: string }
          description: Roles of the user; empty until all login steps are completed.
        permissions:
          type: array
          items: { type: string }
          description: |
            Granted permissions (module:instance:resource:action); empty until all login steps
            are completed. The frontend uses them to hide what the user cannot use; the backend
            checks every request.
        totp: { $ref: "#/components/schemas/TOTPInfo" }

    TOTPInfo:
      type: object
      required: [enrolled, required, recoveryCodesRemaining]
      properties:
        enrolled: { type: boolean }
        required: { type: boolean, description: A role of the user requires TOTP (always for root and the break-glass account). }
        recoveryCodesRemaining: { type: integer }

    TOTPRequest:
      type: object
      description: Exactly one of code and recoveryCode.
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        recoveryCode: { type: string, examples: ["k7m2-x9pq-4hvt-c3wn"] }

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    EnrollmentInfo:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        uri: { type: string, description: "otpauth:// URI, to be shown as QR code." }

    EnrollmentResult:
      type: object
      required: [recoveryCodes, session]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
        session: { $ref: "#/components/schemas/SessionInfo" }

    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }

    SessionSummary:
      type: object
      required: [id, username, displayName, source, stage, createdAt, lastSeenAt, expiresAt, remoteAddr, userAgent, current]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [ldap, local] }
        stage: { type: string, enum: [authenticated, totp, totp_enroll] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        remoteAddr: { type: string }
        userAgent: { type: string }
        current: { type: boolean, description: The session of the request. }

    Preferences:
      type: object
      required: [language, theme]
      additionalProperties: false
      properties:
        language:
          type: string
          enum: ["", en, de]
          description: Empty means the browser language.
        theme:
          type: string
          enum: [system, light, dark]

    UserInfo:
      type: object
      required: [username, displayName, source, groups]
      properties:
        username: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [ldap, local] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupInfo" }

    GroupInfo:
      type: object
      required: [dn, name]
      properties:
        dn: { type: string }
        name: { type: string }

    AuditPage:
      type: object
      required: [entries, nextBefore]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextBefore:
          type: [integer, "null"]
          format: int64
          description: Value of "before" for the next page; null on the last page.

    AuditEntry:
      type: object
      required: [id, time, actor, actorSource, clientIp, action, target, result, details, requestId]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        actor: { type: string, description: "User name; for failed logins the name that was given." }
        actorSource: { type: string, enum: [ldap, local, cli, system, anonymous] }
        clientIp: { type: string }
        action: { type: string, examples: [auth.login, authz.denied] }
        target: { type: string, description: The object acted on (may be empty). }
        result: { type: string, enum: [success, failure, denied] }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }

    DocsPage:
      type: object
      required: [name, title]
      properties:
        name:
          type: string
          description: Page name, the Markdown file name without ".md".
          examples: [security]
        title:
          type: string
          description: Text of the first heading.
        html:
          type: string
          description: |
            The page as HTML, only in GET /api/v1/docs/{page}. Raw HTML of the Markdown is not
            rendered. Links between pages point to /docs/<page>, other links point to GitHub
            and have target="_blank". Heading IDs and link fragments have the prefix "doc-".
    StatusReport:
      type: object
      required: [components, checkedAt]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/StatusComponent" }
        checkedAt: { type: string, format: date-time }

    StatusComponent:
      type: object
      required: [name, kind, status, detail, latencyMs]
      properties:
        name: { type: string, examples: [database, directory, certificate] }
        kind:
          type: string
          description: '"system" for dcdash itself, otherwise the module (proxmox, dns, dhcp, netbox, switch, firewall).'
        status: { type: string, enum: [ok, error] }
        detail: { type: string, description: A detail such as "valid until ..." or the error message, in English. }
        detailCode:
          type: string
          description: |
            Identifies the detail for translation; missing if there is none, for example for
            an error message of a backend. Codes: `certificate.valid` (`until`),
            `certificate.missing`, `certificate.expired` (`at`), `proxmox.connected` (`version`,
            `endpoint`), `dns.bind` (`server`, `count`), `dns.bindChecked` (`server`, `count`,
            `checked`), `dns.cloudflare` (`count`), `dhcp.kea` (`version`), `dhcp.keaHA`
            (`version`, `ha`), `dhcp.partnerOutOfTouch` (`partner`), `directory.connected` (`server`,
            `count`), `directory.degraded` (`server`, `down`), `netbox.connected` (`version`), `switch.aoscx` (`model`, `hostname`, `firmware`),
            `switch.unauthorized`, `switch.sessionLimit`, `switch.unavailable`, `firewall.opnsense` (`product`,
            `version`, `gateways`), `firewall.gatewayDown` (`gateways`, `count`), `firewall.unauthorized`,
            `firewall.forbidden`, `firewall.unavailable`, `projects.loaded` (`count`), `projects.invalid` (`count`, `first`). Times are RFC 3339.
          examples: [certificate.valid]
        detailParams:
          type: object
          description: Parameters of detailCode.
          additionalProperties: { type: string }
        latencyMs: { type: integer, format: int64 }
        type:
          type: string
          description: The kind of system within the module, for dns `bind` or `cloudflare`; missing for the other modules.
        links:
          type: object
          description: The system's own interfaces from the configuration (`ui`, `ssh`, `rdp`); missing if none is set.
          properties:
            ui: { type: string, description: URL of the web interface. }
            ssh: { type: string, description: "ssh:// URL, e.g. ssh://root@pve1.example.com." }
            rdp: { type: string, description: "host[:port] for a Remote Desktop connection." }

    NetBoxGuestComparison:
      type: object
      required: [cluster, netboxCluster, guests]
      properties:
        cluster: { type: string }
        netboxCluster: { type: string }
        guests:
          type: array
          items: { $ref: "#/components/schemas/NetBoxGuestDiff" }

    NetBoxGuestDiff:
      type: object
      required: [name, state, differences, tagged]
      properties:
        type: { type: string, enum: [qemu, lxc], description: Missing for VMs that exist only in NetBox. }
        vmid: { type: integer }
        name: { type: string }
        state: { type: string, enum: [ok, missing, extra, differs] }
        differences:
          type: array
          items: { $ref: "#/components/schemas/NetBoxDifference" }
        netboxId: { type: integer, format: int64, description: ID of the NetBox VM; missing if there is none. }
        tagged: { type: boolean, description: The NetBox VM has the dcdash tag. }

    NetBoxDifference:
      type: object
      required: [field, actual, netbox]
      properties:
        field: { type: string, enum: [name, vcpus, memory, disks, interfaces, addresses] }
        actual: { type: string, description: The value in Proxmox. }
        netbox: { type: string, description: The value in NetBox. }

    NetBoxAddressComparison:
      type: object
      required: [addresses, errors]
      properties:
        addresses:
          type: array
          items: { $ref: "#/components/schemas/NetBoxAddressDiff" }
        errors: { type: array, items: { type: string } }

    NetBoxAddressDiff:
      type: object
      required: [address, source, state]
      properties:
        address: { type: string }
        source: { type: string, description: '"dhcp:<server>" or "dns".', examples: ["dhcp:kea4", dns] }
        name: { type: string, description: Name of the DNS record. }
        state: { type: string, enum: [missing, differs] }
        netbox: { type: string, description: The DNS name in NetBox if it differs. }

    Project:
      type: object
      required: [name, title, color, description, tag, canWrite]
      properties:
        name: { type: string, examples: [webshop] }
        title: { type: string }
        color: { type: string, description: 6 hex digits, examples: [2196f3] }
        description: { type: string }
        tag: { type: string, examples: [project-webshop] }
        canWrite: { type: boolean, description: The user may assign objects to the project. }

    ProjectList:
      type: object
      required: [projects]
      properties:
        projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        state:
          type: object
          required: [errors, orphaned]
          properties:
            errors: { type: array, items: { type: string }, description: Invalid project files. }
            tagError: { type: string, description: The last tag synchronization to NetBox failed. }
            orphaned: { type: array, items: { type: string }, description: NetBox tags with the prefix but without project file. }

    ProjectObjectType:
      type: string
      enum: [vm, ip, iprange, prefix, vlan, interface]

    ProjectObject:
      type: object
      required: [type, id, display]
      properties:
        type: { $ref: "#/components/schemas/ProjectObjectType" }
        id: { type: integer, format: int64 }
        display: { type: string }
        detail: { type: string }
        url: { type: string, description: The object's page in NetBox. }
        cluster: { type: string, description: NetBox cluster of a VM. }
        vmid: { type: integer }
        proxmoxCluster: { type: string, description: Proxmox cluster mapped to the VM's NetBox cluster. }

    ProjectGuest:
      type: object
      required: [cluster, type, vmid, name, node, status, visible]
      properties:
        cluster: { type: string }
        type: { type: string, enum: [qemu, lxc] }
        vmid: { type: integer }
        name: { type: string }
        node: { type: string }
        status: { type: string }
        visible: { type: boolean, description: The user may read the guest. }

    ProjectPage:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [guests, groups, errors]
          properties:
            guests: { type: array, items: { $ref: "#/components/schemas/ProjectGuest" } }
            groups: { type: array, items: { $ref: "#/components/schemas/ProjectGroup" } }
            netbox:
              type: object
              description: NetBox objects by type; missing without NetBox.
              additionalProperties: { type: array, items: { $ref: "#/components/schemas/ProjectObject" } }
            errors: { type: array, items: { type: string } }

    ProjectGroup:
      type: object
      description: |
        An Active Directory group of a project. Description and members only if the user may
        read the group (`directory:<directory>:group/<name>:read`); missing tells that a
        visible group doesn't exist.
      required: [directory, name, visible]
      properties:
        directory: { type: string }
        name: { type: string }
        visible: { type: boolean }
        missing: { type: boolean }
        description: { type: string }
        members:
          type: array
          items:
            type: object
            required: [dn, name, kind]
            properties:
              dn: { type: string }
              name: { type: string }
              displayName: { type: string }
              kind: { type: string, enum: [user, group, computer, other] }
              disabled: { type: boolean }

    NetBoxResult:
      type: object
      description: |
        Result of the write-back to NetBox after a change (missing if the change isn't written
        to NetBox). A failure doesn't undo the change; it is recorded as `netbox.sync`.
      required: [status]
      properties:
        status: { type: string, enum: [ok, failed] }
        error: { type: string, description: The error of NetBox if status is failed. }

    NetBoxWriteBack:
      type: object
      required: [netbox]
      properties:
        netbox: { $ref: "#/components/schemas/NetBoxResult" }

    NetBoxInfo:
      type: object
      required: [name, writeBack, clusters]
      properties:
        name: { type: string, examples: [netbox] }
        writeBack: { type: boolean, description: Changes made in dcdash are written to NetBox. }
        clusters:
          type: array
          description: Proxmox clusters that are mapped to NetBox clusters.
          items: { type: string }

    NetBoxVLAN:
      type: object
      required: [vid, name, description, prefixes]
      properties:
        vid: { type: integer, examples: [100] }
        name: { type: string, examples: [servers] }
        description: { type: string }
        prefixes:
          type: array
          description: Prefixes of the VLAN, IPv4 first.
          items: { $ref: "#/components/schemas/NetBoxPrefix" }

    NetBoxPrefix:
      type: object
      required: [prefix, family, description, free]
      properties:
        prefix: { type: string, examples: [192.0.2.0/24] }
        family: { type: integer, enum: [4, 6] }
        description: { type: string }
        free:
          type: array
          description: Up to 8 free addresses with prefix length; empty if the prefix is full.
          items: { type: string, examples: [192.0.2.3/24] }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: 'Result per check: "ok", a detail such as "valid until <time>", or "error: <message>".'
          additionalProperties: { type: string }

    VersionInfo:
      type: object
      required: [version, commit, date, goVersion]
      properties:
        version: { type: string, examples: ["v0.1.0"] }
        commit: { type: string }
        date: { type: string, description: Build date (RFC 3339) or "unknown" }
        goVersion: { type: string, examples: ["go1.27.4"] }

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [not_found]
            message:
              type: string
              description: English fallback message.

    ProxmoxClusterList:
      type: object
      required: [clusters]
      properties:
        clusters:
          type: array
          items:
            type: object
            required: [name, terminals, provisioning]
            properties:
              name: { type: string }
              terminals:
                type: boolean
                description: |
                  Container terminals and node shells are available. They need a console user in the
                  cluster configuration, because Proxmox does not accept API tokens for them.
              provisioning:
                type: boolean
                description: |
                  Guests can be created and deleted (the cluster has provisioning settings). Users
                  also need `admin` on the guests.

    ProxmoxInventory:
      type: object
      required: [nodes, guests, storage]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxNode" }
        guests:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxGuest" }
        storage:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxStorage" }

    ProxmoxNode:
      type: object
      required: [name, status, cpu, maxCpu, mem, maxMem, disk, maxDisk, uptime]
      properties:
        name: { type: string }
        status: { type: string, description: "online, offline or unknown" }
        cpu: { type: number, description: CPU usage (0..1). }
        maxCpu: { type: number }
        mem: { type: integer, format: int64, description: Bytes. }
        maxMem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxDisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64, description: Seconds. }
        links:
          type: object
          description: >-
            Web interface (`ui`, an http(s) URL) and SSH (`ssh`, an ssh:// URL) of the node, from
            `node_links` or the endpoint whose host is the node name. Absent if unknown.
          properties:
            ui: { type: string }
            ssh: { type: string }

    ProxmoxGuest:
      type: object
      required: [type, vmid, name, node, status, template, tags, pool, lock, haState, cpu, maxCpu, mem, maxMem, disk, maxDisk, uptime]
      properties:
        type: { type: string, enum: [qemu, lxc] }
        vmid: { type: integer }
        name: { type: string }
        node: { type: string }
        status: { type: string, description: "running, stopped, paused, ..." }
        template: { type: boolean }
        tags:
          type: array
          items: { type: string }
        pool: { type: string }
        lock: { type: string }
        haState: { type: string }
        cpu: { type: number }
        maxCpu: { type: number }
        mem: { type: integer, format: int64 }
        maxMem: { type: integer, format: int64 }
        disk: { type: integer, format: int64 }
        maxDisk: { type: integer, format: int64 }
        uptime: { type: integer, format: int64 }

    ProxmoxStorage:
      type: object
      required: [name, node, status, disk, maxDisk]
      properties:
        name: { type: string }
        node: { type: string }
        status: { type: string }
        disk: { type: integer, format: int64 }
        maxDisk: { type: integer, format: int64 }

    ProxmoxGuestDetail:
      type: object
      required: [guest, status, config]
      properties:
        guest:
          allOf: [{ $ref: "#/components/schemas/ProxmoxGuest" }]
          description: >-
            The guest, with `status` taken from status/current (qmpstatus for VMs). The inventory
            uses /cluster/resources, which lags about 10 seconds behind.
        status:
          type: object
          additionalProperties: true
          description: Proxmox status/current as returned by Proxmox.
        config:
          type: object
          additionalProperties: true
          description: Proxmox configuration as returned by Proxmox, without secrets.

    ProxmoxTaskRef:
      type: object
      required: [upid, node]
      properties:
        upid: { type: string }
        node: { type: string }

    ProxmoxDeleteResult:
      type: object
      required: [upid, node]
      properties:
        upid: { type: string }
        node: { type: string }
        netbox: { $ref: "#/components/schemas/NetBoxResult" }

    ProxmoxTask:
      type: object
      required: [upid, node, type, id, user, running, exitStatus, ok, startTime, log]
      properties:
        upid: { type: string }
        node: { type: string }
        type: { type: string, description: "e.g. qmstart, vzshutdown" }
        id: { type: string, description: Usually the VMID. }
        user: { type: string }
        running: { type: boolean }
        exitStatus: { type: string, description: "OK or the error message, once stopped." }
        ok: { type: boolean }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        log:
          type: array
          items: { type: string }

    ProxmoxProvisioningOptions:
      type: object
      required: [node, nodes, storages, isos, containerTemplates, bridges, vlans, vmids, templates, pool, limits, defaults]
      properties:
        node: { type: string, description: The node the storages, images and bridges belong to; empty without nodes. }
        nodes:
          type: array
          description: Online nodes the user may read.
          items: { type: string }
        storages:
          type: array
          items:
            type: object
            required: [name, type, shared, avail, total, vm, container]
            properties:
              name: { type: string }
              type: { type: string, description: "Proxmox storage type, e.g. lvmthin, rbd, dir" }
              shared: { type: boolean }
              avail: { type: integer, format: int64, description: Free bytes. }
              total: { type: integer, format: int64 }
              vm: { type: boolean, description: Holds VM disks. }
              container: { type: boolean, description: Holds container root file systems. }
        isos:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxVolume" }
        containerTemplates:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxVolume" }
        bridges:
          type: array
          items:
            type: object
            required: [name, vlanAware]
            properties:
              name: { type: string }
              vlanAware: { type: boolean }
        vlans:
          type: array
          description: Allowed VLAN tags as numbers or ranges ("100-199"); empty means untagged only.
          items: { type: string }
        vmids:
          type: array
          description: The range of IDs for new guests; empty means any.
          items: { type: string }
        templates:
          type: array
          description: VM templates the user may clone.
          items:
            type: object
            required: [vmid, name, node]
            properties:
              vmid: { type: integer }
              name: { type: string }
              node: { type: string }
        pool: { type: string, description: Proxmox pool new guests are added to. }
        limits:
          type: object
          required: [cores, memory, disk]
          properties:
            cores: { type: integer }
            memory: { type: integer, format: int64, description: MiB. }
            disk: { type: integer, format: int64, description: GiB. }
        defaults:
          type: object
          required: [cores, memory, disk, storage, bridge]
          properties:
            cores: { type: integer }
            memory: { type: integer, format: int64, description: MiB. }
            disk: { type: integer, format: int64, description: GiB. }
            storage: { type: string }
            bridge: { type: string }

    ProxmoxVolume:
      type: object
      required: [volid, size, format]
      properties:
        volid: { type: string, description: "e.g. local:iso/debian-13.4.0-amd64-netinst.iso" }
        size: { type: integer, format: int64 }
        format: { type: string }

    ProxmoxCreateNetwork:
      type: object
      required: [bridge]
      properties:
        bridge: { type: string }
        vlan: { type: integer }
        ipv4: { type: string, description: '"dhcp" or an address with prefix length (containers and cloud-init).' }
        gateway4: { type: string }
        ipv6: { type: string, description: '"auto", "dhcp" or an address with prefix length.' }
        gateway6: { type: string }
        nameservers:
          type: array
          maxItems: 3
          items: { type: string }
          description: Only on the first network device.
        searchDomain: { type: string, description: Only on the first network device. }
        mac: { type: string, description: "MAC address; empty generates one (prefix BC:24:11)." }
    ProxmoxCreateRequest:
      type: object
      required: [type, name, cores, memory, disk]
      properties:
        type: { type: string, enum: [qemu, lxc] }
        node: { type: string, description: Node of a new VM from an ISO image or of a container; clones are created on the template's node. }
        vmid: { type: integer, description: Omit for the next free ID of the range. }
        name: { type: string, description: Host name. }
        source: { type: string, enum: [template, iso], description: VMs only. }
        template: { type: integer, description: VM ID of the template to clone. }
        full: { type: boolean, description: Full clone (otherwise linked). }
        iso: { type: string, description: Volume of the ISO image. }
        osType: { type: string, enum: [linux, windows, other], description: "VMs from an ISO image; windows adds UEFI and a TPM." }
        osTemplate: { type: string, description: Volume of the container template. }
        cores: { type: integer }
        memory: { type: integer, format: int64, description: MiB. }
        disk: { type: integer, format: int64, description: "GiB; for clones 0 keeps the template's size, a larger value grows the boot disk." }
        storage: { type: string, description: Storage of the disk; not for linked clones. }
        networks:
          type: array
          maxItems: 8
          description: The network devices net0, net1, ...; replaces network.
          items: { $ref: "#/components/schemas/ProxmoxCreateNetwork" }
        network:
          $ref: "#/components/schemas/ProxmoxCreateNetwork"
          description: The only network device, for requests without networks (API of v0.1.1).
        reservations:
          type: array
          maxItems: 16
          description: |
            DHCP reservations for the MAC addresses of the network devices, added after the guest
            was created and before it is started. Requires write on the subnet of the DHCP server;
            checked when the request arrives. Audited as dhcp.reservation.create.
          items:
            type: object
            required: [network, server, subnetId]
            properties:
              network: { type: integer, minimum: 0, description: Index of the network device in networks. }
              server: { type: string }
              subnetId: { type: integer }
              ipAddress: { type: string }
              hostname: { type: string }
        records:
          type: array
          maxItems: 16
          description: |
            DNS records, added like the reservations. Requires write on the zone. Audited as
            dns.record.create. Reservations and records together are at most 16.
          items:
            type: object
            required: [provider, zone, name, type, content]
            properties:
              provider: { type: string }
              zone: { type: string }
              name: { type: string, description: Relative to the zone or fully qualified with a trailing dot. }
              type: { type: string, enum: [A, AAAA, PTR] }
              content: { type: string }
              ttl: { type: integer, description: Seconds; 0 or omitted uses 3600. }
        user: { type: string, description: Cloud-init user of a clone. }
        password: { type: string, writeOnly: true, description: Cloud-init password of a clone, or the root password of a container. }
        sshKeys: { type: string, description: Public SSH keys, one per line. }
        start: { type: boolean, description: Start the guest when it's ready. }
        description: { type: string }
        projects:
          type: array
          items: { type: string }
          description: Projects of the new guest, added as tags project-<name>; each needs `project:<name>:objects:write`.
        tags:
          type: array
          items: { type: string }

    ProxmoxJob:
      type: object
      required: [id, cluster, type, vmid, node, name, user, state, steps, created]
      properties:
        id: { type: string }
        cluster: { type: string }
        type: { type: string, enum: [qemu, lxc] }
        vmid: { type: integer }
        node: { type: string }
        name: { type: string }
        user: { type: string, description: The user who started the job. }
        state: { type: string, enum: [running, done, failed] }
        error: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [name, state]
            properties:
              name: { type: string, enum: [clone, configure, resize, create, netbox, dhcp, dns, start] }
              detail: { type: string, description: What a dhcp or dns step adds, e.g. "192.0.2.50 (kea4)". }
              state: { type: string, enum: [pending, running, done, failed, skipped] }
              upid: { type: string, description: The Proxmox task of the step. }
              error: { type: string }
        created: { type: string, format: date-time }
        ended: { type: string, format: date-time }

    ProxmoxHardware:
      type: object
      required: [digest, running, options, disks, networks, configurable, storages, bridges, vlans, limits]
      properties:
        digest: { type: string, description: Identifies the configuration; changes send it back. }
        running: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxOptionSetting" }
        disks:
          type: array
          description: Attached and unused disks, without CD-ROM drives.
          items: { $ref: "#/components/schemas/ProxmoxHardwareDisk" }
        networks:
          type: array
          items: { $ref: "#/components/schemas/ProxmoxNetworkDevice" }
        configurable: { type: boolean, description: The cluster has provisioning settings. }
        storages: { type: array, items: { type: string }, description: Storages for new disks. }
        bridges: { type: array, items: { type: string } }
        vlans: { type: array, items: { type: string }, description: "Allowed VLAN ranges, e.g. 100-199." }
        limits:
          type: object
          required: [cores, memory, disk]
          properties:
            cores: { type: integer }
            memory: { type: integer, description: MiB }
            disk: { type: integer, description: GiB }
    ProxmoxOptionSetting:
      type: object
      required: [key, value, set]
      properties:
        key:
          type: string
          enum: [name, description, tags, onboot, protection, agent, boot, cores, sockets, memory, balloon, cpu, numa, ostype, hotplug]
        value: { type: string, description: The active value. }
        set: { type: boolean, description: False if the option is not set (Proxmox uses its default). }
        pending: { type: string, description: A change that takes effect at the next start. }
        delete: { type: boolean, description: The removal is pending. }
    ProxmoxHardwareDisk:
      type: object
      required: [key, bus, volume, storage, size, sizeBytes, discard, ssd, iothread, backup, active]
      properties:
        key: { type: string, examples: [scsi0] }
        bus: { type: string, enum: [scsi, virtio, sata, ide, unused] }
        volume: { type: string, examples: ["local-lvm:vm-101-disk-0"] }
        storage: { type: string }
        size: { type: string, examples: [32G] }
        sizeBytes: { type: integer, format: int64 }
        discard: { type: boolean }
        ssd: { type: boolean }
        iothread: { type: boolean }
        backup: { type: boolean, description: False if the disk is excluded from backups. }
        active: { type: boolean, description: False if the addition of the disk is pending. }
        pending: { type: string, description: Pending value. }
        delete: { type: boolean }
    ProxmoxNetworkDevice:
      type: object
      required: [key, model, mac, bridge, firewall, linkDown, active]
      properties:
        key: { type: string, examples: [net0] }
        model: { type: string, enum: [virtio, e1000, e1000e, vmxnet3, rtl8139] }
        mac: { type: string, examples: ["BC:24:11:12:34:56"] }
        bridge: { type: string }
        vlan: { type: integer }
        firewall: { type: boolean }
        linkDown: { type: boolean }
        active: { type: boolean }
        pending: { type: string }
        delete: { type: boolean }
    ProxmoxOptionsRequest:
      type: object
      properties:
        digest: { type: string }
        set: { type: object, additionalProperties: { type: string } }
        delete: { type: array, items: { type: string } }
        revert: { type: array, items: { type: string }, description: Keys whose pending changes are dropped. }
    ProxmoxDiskRequest:
      type: object
      required: [bus, storage, sizeGiB]
      properties:
        digest: { type: string }
        bus: { type: string, enum: [scsi, virtio, sata, ide] }
        storage: { type: string }
        sizeGiB: { type: integer, minimum: 1 }
        discard: { type: boolean }
        ssd: { type: boolean, description: Not on virtio. }
        iothread: { type: boolean, description: Only on scsi and virtio. }
        noBackup: { type: boolean }
    ProxmoxDiskUpdate:
      type: object
      properties:
        digest: { type: string }
        sizeGiB: { type: integer, description: New size; larger than the current one. Omit to keep it. }
        discard: { type: boolean }
        ssd: { type: boolean }
        iothread: { type: boolean }
        noBackup: { type: boolean }
    ProxmoxDiskAction:
      type: object
      properties:
        digest: { type: string }
        bus: { type: string, enum: [scsi, virtio, sata, ide], description: For attach. }
        confirm: { type: string, description: For delete, the disk key. }
    ProxmoxNetworkRequest:
      type: object
      required: [model, bridge]
      properties:
        digest: { type: string }
        model: { type: string, enum: [virtio, e1000, e1000e, vmxnet3, rtl8139] }
        bridge: { type: string }
        vlan: { type: integer }
        firewall: { type: boolean }
        linkDown: { type: boolean }
        mac: { type: string, description: For new devices; empty generates one. }
    ProxmoxNetworkAction:
      type: object
      properties:
        digest: { type: string }
    ProxmoxConfigResult:
      type: object
      required: [node, done]
      properties:
        key: { type: string, description: The disk or network device that was created or attached. }
        upid: { type: string }
        node: { type: string }
        done: { type: boolean, description: False if the task was still running. }
        netbox: { $ref: "#/components/schemas/NetBoxResult" }
    ProxmoxDeleteRequest:
      type: object
      required: [confirm]
      properties:
        confirm: { type: string, description: "The guest's name (or its ID if it has no name), typed by the user." }
        purge: { type: boolean, description: Also remove the guest from backup jobs, replication and HA. }

    ProxmoxConsoleTicket:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, description: One-time ticket for the websocket. }
        kind: { type: string, enum: [vnc, term] }
        password: { type: string, description: VNC password for noVNC (only for vnc). }

    DNSCapabilities:
      type: object
      required: [proxied, comments, autoTtl, zoneCreate]
      properties:
        proxied: { type: boolean, description: Records have the Cloudflare proxy flag. }
        comments: { type: boolean, description: Records have comments. }
        autoTtl: { type: boolean, description: TTL 1 means automatic. }
        zoneCreate: { type: boolean, description: Zones can be created and deleted. }

    DNSProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [name, kind, capabilities]
            properties:
              name: { type: string }
              kind: { type: string, enum: [cloudflare, bind, ad] }
              capabilities: { $ref: "#/components/schemas/DNSCapabilities" }

    DNSZone:
      type: object
      required: [name]
      properties:
        name: { type: string, description: Zone name without trailing dot. }
        status: { type: string, description: "Cloudflare: active, pending, ..." }
        nameServers:
          type: array
          items: { type: string }
          description: Cloudflare name servers to delegate the zone to.

    DNSZoneList:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          items: { $ref: "#/components/schemas/DNSZone" }

    DNSZoneRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string }

    DNSRecord:
      type: object
      required: [id, name, type, ttl, content, version]
      properties:
        netbox: { $ref: "#/components/schemas/NetBoxResult" }
        id: { type: string }
        name: { type: string, description: Fully qualified name without trailing dot. }
        type: { type: string, examples: [A, MX, TXT] }
        ttl: { type: integer, description: Seconds; 1 means automatic (Cloudflare). }
        content:
          type: string
          description: RDATA in zone-file presentation format, e.g. "10 mail.example.org." for MX.
        proxied: { type: boolean, description: Cloudflare proxy flag (A, AAAA, CNAME). }
        comment: { type: string }
        readOnly: { type: boolean, description: SOA, DNSSEC and other types dcdash can't edit. }
        version: { type: string, description: Send back with an update or delete. }

    DNSRecordSet:
      type: object
      required: [records, version]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/DNSRecord" }
        version: { type: string, description: "Send with a new record (bind9: SOA serial; empty for Cloudflare)." }

    DNSRecordRequest:
      type: object
      required: [name, type, content]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: { type: string }
          description: Projects of the address of an A or AAAA record in NetBox; missing keeps them. Each added or removed project needs `project:<name>:objects:write`.
        name:
          type: string
          description: Relative to the zone, "@" for the apex, or fully qualified.
        type: { type: string, enum: [A, AAAA, CNAME, MX, TXT, SRV, PTR, NS, CAA] }
        ttl: { type: integer, minimum: 0, description: "0: the default of the provider." }
        content:
          type: string
          description: RDATA in presentation format; plain TXT text is quoted automatically.
        proxied: { type: boolean }
        comment: { type: string }
        version: { type: string }

    DHCPCapabilities:
      type: object
      required: [leases, leaseDelete, reservations, reservationWrite, subnets, statistics, ha]
      properties:
        leases: { type: boolean, description: List and search leases (lease_cmds). }
        leaseDelete: { type: boolean, description: Delete leases (lease_cmds). }
        reservations: { type: boolean, description: List reservations (host_cmds). }
        reservationWrite: { type: boolean, description: Change reservations (host_cmds and a host database). }
        subnets: { type: boolean, description: Pools of the subnets (subnet_cmds). }
        statistics: { type: boolean, description: Utilization of the subnets (stat_cmds). }
        ha: { type: boolean, description: The HA hook is loaded. }

    DHCPServer:
      type: object
      required: [name, family, status, capabilities, hostDatabase, ha, searchKeys]
      properties:
        name: { type: string }
        family: { type: string, enum: [v4, v6] }
        haGroup: { type: string }
        partners:
          type: array
          items: { type: string }
          description: The other servers of the HA group.
        status: { type: string, enum: [ok, unavailable] }
        error: { type: string, description: Why the server is unavailable. }
        version: { type: string, examples: ["3.0.4"] }
        uptime: { type: integer, description: Seconds since the start. }
        capabilities: { $ref: "#/components/schemas/DHCPCapabilities" }
        hostDatabase: { type: boolean }
        ha:
          type: array
          items:
            type: object
            required: [mode, role, state, partner, partnerState, inTouch]
            properties:
              mode: { type: string, examples: [hot-standby, load-balancing] }
              role: { type: string }
              state: { type: string }
              partner: { type: string }
              partnerState: { type: string }
              inTouch: { type: boolean }
        searchKeys:
          type: array
          items: { type: string, enum: [ip, hw-address, client-id, duid, hostname] }

    DHCPServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/DHCPServer" }

    Firewall:
      type: object
      required: [name, type, url, host, status]
      properties:
        name: { type: string }
        type: { type: string, enum: [opnsense] }
        url: { type: string, description: URL of the web interface from the configuration. }
        host: { type: string, description: Host name or address, for SSH. }
        status: { type: string, enum: [ok, unavailable] }
        error: { type: string }
        product: { type: string, examples: [OPNsense] }
        version: { type: string, examples: [26.1.6] }
        uptime: { type: string, description: As OPNsense formats it. }
        memoryUsed: { type: integer, description: Bytes. }
        memoryTotal: { type: integer, description: Bytes. }

    FirewallList:
      type: object
      required: [firewalls]
      properties:
        firewalls: { type: array, items: { $ref: "#/components/schemas/Firewall" } }

    FirewallGateway:
      type: object
      required: [name, address, status, detail]
      properties:
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [online, down, degraded] }
        detail: { type: string, description: "OPNsense's state: none, down, force_down, delay, loss, delay+loss." }
        delay: { type: string, examples: [1.2 ms] }
        stddev: { type: string }
        loss: { type: string, examples: [0.0 %] }

    FirewallService:
      type: object
      required: [id, name, description, running, locked]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        running: { type: boolean }
        locked: { type: boolean, description: OPNsense needs the service. }

    FirewallHealth:
      type: object
      required: [gateways, services, canOperate]
      properties:
        gateways: { type: array, items: { $ref: "#/components/schemas/FirewallGateway" } }
        services: { type: array, items: { $ref: "#/components/schemas/FirewallService" } }
        canOperate: { type: boolean, description: The user may restart services. }

    FirewallPeer:
      type: object
      required: [uuid, name, enabled, publicKey, latestHandshake, rxBytes, txBytes, status, canOperate]
      properties:
        uuid: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        publicKey: { type: string }
        endpoint: { type: string }
        allowedIps: { type: string }
        interface: { type: string }
        latestHandshake: { type: string, format: date-time, description: "0001-01-01T00:00:00Z if there was none." }
        rxBytes: { type: integer }
        txBytes: { type: integer }
        status: { type: string, description: "online (handshake in the last 5 minutes), stale, offline, or empty." }
        canOperate: { type: boolean }

    FirewallChildSA:
      type: object
      required: [name, bytesIn, bytesOut]
      properties:
        name: { type: string }
        description: { type: string }
        state: { type: string, examples: [INSTALLED] }
        localTs: { type: string }
        remoteTs: { type: string }
        bytesIn: { type: integer }
        bytesOut: { type: integer }

    FirewallTunnel:
      type: object
      required: [name, description, connected, bytesIn, bytesOut, children, canOperate]
      properties:
        name: { type: string }
        description: { type: string }
        connected: { type: boolean }
        localAddrs: { type: string }
        remoteAddrs: { type: string }
        bytesIn: { type: integer }
        bytesOut: { type: integer }
        children: { type: array, items: { $ref: "#/components/schemas/FirewallChildSA" } }
        canOperate: { type: boolean }

    FirewallVPN:
      type: object
      required: [peers, tunnels, errors]
      properties:
        peers: { type: array, items: { $ref: "#/components/schemas/FirewallPeer" } }
        tunnels: { type: array, items: { $ref: "#/components/schemas/FirewallTunnel" } }
        errors:
          type: object
          description: Errors by part (wireguard, ipsec).
          additionalProperties: { type: string }

    FirewallAlias:
      type: object
      required: [uuid, name, type, enabled, content, description, canWrite, editable]
      properties:
        uuid: { type: string }
        name: { type: string }
        type: { type: string, examples: [host] }
        enabled: { type: boolean }
        content: { type: array, items: { type: string } }
        description: { type: string }
        canWrite: { type: boolean }
        editable: { type: boolean, description: "dcdash edits host, network, port, url, urltable, mac and networkgroup aliases." }

    FirewallAliasList:
      type: object
      required: [aliases, canCreate]
      properties:
        aliases: { type: array, items: { $ref: "#/components/schemas/FirewallAlias" } }
        canCreate: { type: boolean }

    FirewallAliasRequest:
      type: object
      required: [name, type, enabled, content]
      properties:
        name: { type: string, maxLength: 32 }
        type: { type: string, enum: [host, network, port, url, urltable, mac, networkgroup] }
        enabled: { type: boolean }
        content: { type: array, items: { type: string }, maxItems: 4096 }
        description: { type: string, maxLength: 255 }

    FirewallRuleRequest:
      type: object
      required: [enabled, action, interface, direction, ipProtocol]
      properties:
        enabled: { type: boolean }
        sequence: { type: integer, description: "Order (lower first), 1 to 999999. In a request, 0 or missing means after the last rule (create) or unchanged (update)." }
        action: { type: string, enum: [pass, block, reject] }
        quick: { type: boolean }
        interface: { type: string, examples: [lan] }
        direction: { type: string, enum: [in, out] }
        ipProtocol: { type: string, enum: [inet, inet6, inet46] }
        protocol: { type: string, examples: [any, TCP, UDP, TCP/UDP, ICMP] }
        source: { type: string, description: "any, an address, a network, an alias or an interface network (lan)." }
        sourceNot: { type: boolean }
        sourcePort: { type: string }
        destination: { type: string }
        destinationNot: { type: boolean }
        destinationPort: { type: string, description: Only with TCP or UDP. }
        log: { type: boolean }
        description: { type: string, maxLength: 255 }

    FirewallRule:
      allOf:
        - $ref: "#/components/schemas/FirewallRuleRequest"
        - type: object
          required: [uuid, sequence, quick, protocol, source, sourceNot, sourcePort, destination, destinationNot, destinationPort, log, description, legacy, canWrite]
          properties:
            uuid: { type: string, description: Empty for legacy rules. }
            legacy: { type: boolean, description: Legacy or automatic rule, read-only. }
            canWrite: { type: boolean }

    FirewallRuleList:
      type: object
      required: [rules, canCreate, noSavepoint]
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/FirewallRule" } }
        canCreate: { type: boolean }
        noSavepoint: { type: boolean, description: "The firewall has no savepoints (OPNsense 26.7 and later): nothing undoes a rule change, so dcdash doesn't change rules that could cut it off." }
        protectedInterfaces: { type: array, items: { type: string }, description: "Without savepoints: the interfaces dcdash reaches the firewall through (and the configured protected_interfaces); dcdash doesn't change their rules, floating rules, or rules on interface groups." }
        guardError: { type: string, description: "Without savepoints: why dcdash can't tell which interface it reaches the firewall through; it then doesn't change rules." }

    FirewallRuleResult:
      type: object
      required: [kept, rolledBack]
      properties:
        kept: { type: boolean, description: The change is applied and kept. }
        rolledBack: { type: boolean, description: dcdash couldn't reach the firewall after the change; OPNsense restores the previous rules within a minute. }
        lockedOut: { type: boolean, description: "Without savepoints: dcdash couldn't reach the firewall after the change, and nothing undoes it." }
        warning: { type: string }
        rule: { $ref: "#/components/schemas/FirewallRule" }

    SwitchNeighbor:
      type: object
      required: [chassisId, portId, capabilities, bridge]
      properties:
        chassisId: { type: string }
        portId: { type: string }
        systemName: { type: string }
        systemDescription: { type: string }
        portDescription: { type: string }
        mgmtAddress: { type: string }
        capabilities: { type: array, items: { type: string }, examples: [[Bridge, Router]] }
        bridge: { type: boolean, description: The neighbor is a switch. }

    SwitchPort:
      type: object
      required: [name, type, description, enabled, adminUp, linkUp, speedMbps, mode, vlan, trunkVlans, allVlans, neighbors, uplink, canOperate, canWrite]
      properties:
        name: { type: string, examples: [1/1/5] }
        type: { type: string, enum: [system, lag] }
        description: { type: string }
        enabled: { type: boolean, description: Configured state (shutdown is false). }
        adminUp: { type: boolean }
        linkUp: { type: boolean }
        speedMbps: { type: integer }
        connector: { type: string, examples: [RJ45] }
        maxSpeedMbps: { type: integer }
        mode: { type: string, enum: [access, trunk] }
        vlan: { type: integer, description: Access VLAN or native VLAN of a trunk. }
        nativeTagged: { type: boolean }
        trunkVlans: { type: array, items: { type: integer } }
        allVlans: { type: boolean, description: A trunk that allows all VLANs. }
        lag: { type: string, description: The LAG the port belongs to. }
        members: { type: array, items: { type: string }, description: Ports of a LAG. }
        neighbors:
          type: array
          items: { $ref: "#/components/schemas/SwitchNeighbor" }
        poe:
          type: object
          properties:
            status: { type: string }
            powerDrawnW: { type: number }
        uplink: { type: boolean, description: A trunk or a port to another switch (LLDP). }
        canOperate: { type: boolean }
        canWrite: { type: boolean }
        netbox:
          type: object
          required: [id, projects]
          properties:
            id: { type: integer, description: ID of the NetBox interface. }
            projects: { type: array, items: { type: string } }

    SwitchVLAN:
      type: object
      required: [id, name, type, adminUp, operUp, canWrite]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, examples: [static, default] }
        adminUp: { type: boolean }
        operUp: { type: boolean }
        description: { type: string }
        canWrite: { type: boolean }

    SwitchPortList:
      type: object
      required: [switch, ports, vlans]
      properties:
        switch: { type: string }
        ports: { type: array, items: { $ref: "#/components/schemas/SwitchPort" } }
        vlans: { type: array, items: { $ref: "#/components/schemas/SwitchVLAN" } }
        netboxError: { type: string, description: The NetBox interfaces could not be read. }

    SwitchPortUpdate:
      type: object
      description: Fields to change; missing fields stay unchanged.
      properties:
        enabled: { type: boolean }
        description: { type: string, maxLength: 64 }
        mode: { type: string, enum: [access, trunk] }
        vlan: { type: integer, description: Access VLAN or native VLAN of a trunk. }
        trunkVlans: { type: array, items: { type: integer }, description: Allowed VLANs of a trunk; empty allows all. }

    SwitchChangeResult:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean, description: The configuration was saved to the startup configuration. }
        saveError: { type: string }
        netbox: { $ref: "#/components/schemas/NetBoxResult" }

    SwitchPortResult:
      allOf:
        - $ref: "#/components/schemas/SwitchChangeResult"
        - type: object
          required: [port]
          properties:
            port: { $ref: "#/components/schemas/SwitchPort" }

    SwitchVLANList:
      type: object
      required: [switch, vlans, usage, canCreate]
      properties:
        switch: { type: string }
        vlans: { type: array, items: { $ref: "#/components/schemas/SwitchVLAN" } }
        usage:
          type: object
          description: Ports that use a VLAN (access, native or trunk), by VLAN ID.
          additionalProperties: { type: array, items: { type: string } }
        canCreate: { type: boolean, description: "The user may create VLANs (write on some vlan/<id>)." }

    SwitchVLANRequest:
      type: object
      required: [name]
      properties:
        id: { type: integer, minimum: 2, maximum: 4094, description: Only for creating. }
        name: { type: string, maxLength: 32 }

    SwitchVLANResult:
      allOf:
        - $ref: "#/components/schemas/SwitchChangeResult"
        - type: object
          properties:
            vlan:
              type: object
              required: [id, name, type, adminUp, operUp]
              properties:
                id: { type: integer }
                name: { type: string }
                type: { type: string }
                adminUp: { type: boolean }
                operUp: { type: boolean }

    SwitchMACResult:
      type: object
      required: [switch, mac, vlan, port, uplink, from]
      properties:
        switch: { type: string }
        mac: { type: string }
        vlan: { type: integer }
        port: { type: string }
        portDescription: { type: string }
        uplink: { type: boolean, description: The device is behind another switch. }
        from: { type: string, examples: [dynamic] }

    SwitchMACSearch:
      type: object
      required: [query, results, errors]
      properties:
        query: { type: string }
        results: { type: array, items: { $ref: "#/components/schemas/SwitchMACResult" } }
        errors:
          type: array
          items:
            type: object
            required: [switch, error]
            properties:
              switch: { type: string }
              error: { type: string }

    SwitchMember:
      type: object
      description: A chassis of the switch, several for a stack (VSF).
      required: [name, product, serial, partNumber]
      properties:
        name: { type: string, description: Member number., examples: ["1"] }
        product: { type: string, examples: ["6000 24G 4SFP Swch"] }
        serial: { type: string }
        partNumber: { type: string, examples: [R8N88A] }

    Switch:
      type: object
      required: [name, type, url, host, status, members]
      properties:
        name: { type: string, description: Name from the configuration. }
        type: { type: string, enum: [aoscx] }
        url: { type: string, description: URL of the switch from the configuration (its web interface). }
        host: { type: string, description: Host name or address of the switch, for SSH. }
        status: { type: string, enum: [ok, unavailable] }
        error: { type: string, description: Why the switch is unavailable. }
        hostname: { type: string }
        model: { type: string, description: Product name of the first chassis, or the platform. }
        platform: { type: string, examples: ["6000"] }
        firmware: { type: string, examples: [PL.10.08.1010] }
        apiVersion: { type: string, examples: [v10.08] }
        booted: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: "#/components/schemas/SwitchMember" }

    SwitchList:
      type: object
      required: [switches]
      properties:
        switches:
          type: array
          items: { $ref: "#/components/schemas/Switch" }

    DHCPSubnetStats:
      type: object
      required: [subnetId, total, assigned, declined]
      properties:
        subnetId: { type: integer }
        total: { type: number, description: Addresses in the pools (v6 IA_NA); can exceed 2^53. }
        assigned: { type: number }
        declined: { type: number }
        totalPd: { type: number, description: Delegatable prefixes (v6). }
        assignedPd: { type: number }

    DHCPSubnet:
      type: object
      required: [id, prefix, pools]
      properties:
        id: { type: integer }
        prefix: { type: string, examples: ["192.0.2.0/24"] }
        sharedNetwork: { type: string }
        pools:
          type: array
          items: { type: string, examples: ["192.0.2.100-192.0.2.199"] }
        pdPools:
          type: array
          items: { type: string, examples: ["2001:db8:8000::/48 → /56"] }
        stats: { $ref: "#/components/schemas/DHCPSubnetStats" }

    DHCPSubnetList:
      type: object
      required: [subnets]
      properties:
        subnets:
          type: array
          items: { $ref: "#/components/schemas/DHCPSubnet" }

    DHCPLease:
      type: object
      required: [ipAddress, subnetId, subnet, state, validLifetime, expires, canDelete]
      properties:
        ipAddress: { type: string }
        type: { type: string, enum: [IA_NA, IA_PD], description: DHCPv6 only. }
        prefixLen: { type: integer }
        hwAddress: { type: string }
        clientId: { type: string }
        duid: { type: string }
        iaid: { type: integer }
        hostname: { type: string }
        subnetId: { type: integer }
        subnet: { type: string }
        state: { type: string, enum: [assigned, declined, expired, released] }
        validLifetime: { type: integer }
        preferredLifetime: { type: integer }
        expires: { type: string, format: date-time }
        canDelete: { type: boolean, description: The user may delete the lease. }

    DHCPLeaseList:
      type: object
      required: [leases, truncated]
      properties:
        leases:
          type: array
          items: { $ref: "#/components/schemas/DHCPLease" }
        truncated: { type: boolean, description: The subnet has more leases than returned. }

    DHCPLeaseDeleteResult:
      type: object
      required: [partners]
      properties:
        partners:
          type: array
          items:
            type: object
            required: [server, done]
            properties:
              server: { type: string }
              done: { type: boolean, description: "false without error: the partner had no such lease." }
              error: { type: string }

    DHCPReservation:
      type: object
      required: [id, version, subnetId, subnet, identifierType, identifier, ipAddresses, source, readOnly]
      properties:
        netbox: { $ref: "#/components/schemas/NetBoxResult" }
        id: { type: string }
        version: { type: string, description: Send back with an update or delete. }
        subnetId: { type: integer, description: "0: global reservation." }
        subnet: { type: string }
        identifierType: { type: string, examples: [hw-address, duid, client-id] }
        identifier: { type: string }
        ipAddresses:
          type: array
          items: { type: string }
        prefixes:
          type: array
          items: { type: string }
        hostname: { type: string }
        clientClasses:
          type: array
          items: { type: string }
        options: { type: integer, description: Number of option values (not editable in dcdash). }
        source: { type: string, enum: [config, database] }
        readOnly: { type: boolean }

    DHCPReservationList:
      type: object
      required: [reservations]
      properties:
        reservations:
          type: array
          items: { $ref: "#/components/schemas/DHCPReservation" }

    DHCPReservationRequest:
      type: object
      required: [subnetId, identifierType, identifier]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: { type: string }
          description: Projects of the reserved addresses in NetBox; missing keeps them. Each added or removed project needs `project:<name>:objects:write`.
        subnetId: { type: integer, minimum: 0 }
        identifierType:
          type: string
          enum: [hw-address, client-id, duid]
          description: "client-id for DHCPv4, duid for DHCPv6."
        identifier: { type: string, description: "Hex bytes, e.g. aa:bb:cc:dd:ee:ff." }
        ipAddresses:
          type: array
          items: { type: string }
          description: At most one for DHCPv4; within the subnet.
        prefixes:
          type: array
          items: { type: string }
          description: Delegated prefixes (DHCPv6).
        hostname: { type: string }
        version: { type: string, description: Required for updates. }

    DirectoryList:
      type: object
      required: [directories]
      properties:
        directories: { type: array, items: { $ref: "#/components/schemas/Directory" } }

    Directory:
      type: object
      required: [name, type, domain, managedOUs, canCreateUsers, canCreateGroups]
      properties:
        name: { type: string }
        type: { type: string, enum: [samba, windows] }
        domain: { type: string }
        managedOUs: { type: array, items: { type: string }, description: Containers dcdash may change objects in. }
        canCreateUsers: { type: boolean }
        canCreateGroups: { type: boolean }

    DirectoryContainerList:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            type: object
            required: [dn, name]
            properties:
              dn: { type: string }
              name: { type: string }

    DirectoryPasswordPolicy:
      type: object
      required: [minLength, complexity, history, minAge, maxAge, lockoutThreshold, lockoutDuration]
      properties:
        minLength: { type: integer }
        complexity: { type: boolean, description: "Three of: upper case, lower case, digits, other characters; not the account or display name." }
        history: { type: integer, description: Number of previous passwords that can't be reused. }
        minAge: { type: integer, description: Seconds before a password may be changed again; 0 for none. }
        maxAge: { type: integer, description: Seconds until a password expires; 0 for never. }
        lockoutThreshold: { type: integer, description: Failed logins that lock an account; 0 for none. }
        lockoutDuration: { type: integer, description: Seconds an account stays locked. }

    DirectoryUserList:
      type: object
      required: [users, truncated]
      properties:
        users: { type: array, items: { $ref: "#/components/schemas/DirectoryUser" } }
        truncated: { type: boolean, description: There are more matches than limit. }

    DirectoryUser:
      type: object
      required: [dn, name, disabled, lockedOut, mustChangePassword, passwordExpired, passwordNeverExpires, groups, managed, protected, canOperate, canWrite]
      properties:
        dn: { type: string }
        name: { type: string, description: The account name (sAMAccountName). }
        upn: { type: string }
        givenName: { type: string }
        surname: { type: string }
        displayName: { type: string }
        mail: { type: string }
        description: { type: string }
        disabled: { type: boolean }
        lockedOut: { type: boolean, description: Locked out by failed logins. }
        mustChangePassword: { type: boolean }
        passwordExpired: { type: boolean }
        passwordNeverExpires: { type: boolean }
        passwordLastSet: { type: string, format: date-time }
        lastLogon: { type: string, format: date-time, description: "lastLogonTimestamp: replicated, up to two weeks behind." }
        created: { type: string, format: date-time }
        changed: { type: string, format: date-time }
        groups: { type: array, items: { type: string }, description: DNs of the groups the user is a direct member of (without the primary group). }
        managed: { type: boolean, description: In a container dcdash manages. }
        protected: { type: boolean, description: "Built-in or privileged, or configured as protected: changes need admin." }
        canOperate: { type: boolean, description: The user may disable, enable, unlock and reset it. }
        canWrite: { type: boolean, description: The user may change and delete it. }

    DirectoryNewUser:
      type: object
      required: [ou, name, password]
      additionalProperties: false
      properties:
        ou: { type: string, description: DN of a managed container. }
        name: { type: string, maxLength: 20, description: The account name (sAMAccountName). }
        upn: { type: string, description: "Default: name@domain." }
        givenName: { type: string }
        surname: { type: string }
        displayName: { type: string }
        mail: { type: string }
        description: { type: string }
        password: { type: string, maxLength: 256, format: password }
        mustChangePassword: { type: boolean }
        disabled: { type: boolean }

    DirectoryUserChange:
      type: object
      additionalProperties: false
      description: Missing attributes stay; an empty string removes one (not upn).
      properties:
        upn: { type: string }
        givenName: { type: string }
        surname: { type: string }
        displayName: { type: string }
        mail: { type: string }
        description: { type: string }

    DirectoryPasswordReset:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, maxLength: 256, format: password }
        mustChangePassword: { type: boolean }

    DirectoryGroupList:
      type: object
      required: [groups, truncated]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/DirectoryGroup" } }
        truncated: { type: boolean }

    DirectoryGroup:
      type: object
      required: [dn, name, scope, security, managed, protected, canWrite]
      properties:
        dn: { type: string }
        name: { type: string, description: The account name (sAMAccountName). }
        description: { type: string }
        mail: { type: string }
        scope: { $ref: "#/components/schemas/DirectoryGroupScope" }
        security: { type: boolean, description: A security group (else a distribution group). }
        created: { type: string, format: date-time }
        changed: { type: string, format: date-time }
        managed: { type: boolean }
        protected: { type: boolean }
        canWrite: { type: boolean }
        members:
          type: array
          description: Direct members; only for a single group.
          items:
            type: object
            required: [dn, name, kind]
            properties:
              dn: { type: string }
              name: { type: string }
              displayName: { type: string }
              kind: { type: string, enum: [user, group, computer, other] }
              disabled: { type: boolean }

    DirectoryGroupScope:
      type: string
      enum: [global, domainLocal, universal]

    DirectoryNewGroup:
      type: object
      required: [ou, name]
      additionalProperties: false
      properties:
        ou: { type: string, description: DN of a managed container. }
        name: { type: string, maxLength: 64 }
        description: { type: string }
        mail: { type: string }
        scope: { $ref: "#/components/schemas/DirectoryGroupScope" }
        security: { type: boolean }

    DirectoryGroupChange:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 64, description: Renames the group (CN and sAMAccountName). }
        description: { type: string }
        mail: { type: string }
        scope: { $ref: "#/components/schemas/DirectoryGroupScope" }
        security: { type: boolean }

    DirectoryMembersChange:
      type: object
      additionalProperties: false
      properties:
        add: { type: array, items: { type: string }, description: Account names. }
        remove: { type: array, items: { type: string } }

    SelfServiceDirectoryList:
      type: object
      required: [directories]
      properties:
        directories:
          type: array
          items:
            type: object
            required: [name, domain]
            properties:
              name: { type: string }
              domain: { type: string }
              policy: { $ref: "#/components/schemas/DirectoryPasswordPolicy" }

    SelfServicePasswordChange:
      type: object
      required: [directory, username, currentPassword, newPassword]
      additionalProperties: false
      properties:
        directory: { type: string }
        username: { type: string, description: Account name or user principal name. }
        currentPassword: { type: string, format: password, maxLength: 256 }
        newPassword: { type: string, format: password, maxLength: 256 }
