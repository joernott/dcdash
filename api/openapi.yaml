openapi: 3.1.0
info:
  title: dcdash API
  description: |
    REST API of dcdash. All endpoints below `/api/v1` return JSON.
    Errors use the `ErrorBody` schema; `error.code` is stable and translated by the frontend.
  version: 0.1.0
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later

tags:
  - name: system
    description: Health and build information
  - name: auth
    description: Login, logout and session information
  - name: me
    description: Settings of the logged-in user
  - name: audit
    description: Audit log
  - name: admin
    description: Administration of sessions and TOTP enrollments

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: The process is up and serving HTTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /readyz:
    get:
      tags: [system]
      operationId: getReady
      summary: Readiness probe
      description: Evaluates all registered readiness checks.
      responses:
        "200":
          description: All checks pass.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503":
          description: At least one check fails.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /api/v1/version:
    get:
      tags: [system]
      operationId: getVersion
      summary: Build information
      responses:
        "200":
          description: Version of the running server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionInfo" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: State of dcdash's components and backends
      description: |
        For the dashboard; requires a logged-in user. Unlike /readyz it includes components
        whose failure must not take dcdash out of a load balancer, such as the directory.
        Checks run concurrently with a timeout of 5 seconds each.
      responses:
        "200":
          description: The state of every component.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with user name and password
      description: |
        Verifies the credentials against the directory and starts a session. The session
        token is set as an HttpOnly cookie; the returned csrfToken must be sent in the
        X-CSRF-Token header of all state-changing requests.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              description: Session cookie (__Host-dcdash_session).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401":
          description: "Invalid credentials (code: invalid_credentials)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "403":
          description: "Break-glass account without TOTP enrollment (code: totp_not_enrolled)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          description: "Too many failed attempts (code: too_many_attempts)."
          headers:
            Retry-After:
              description: Seconds until the next attempt is allowed.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "503":
          description: "The directory is unavailable (code: directory_unavailable)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - { session: [], csrf: [] }
      responses:
        "204":
          description: Logged out (also when there was no session).
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current session
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401":
          description: "Not logged in (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }


  /api/v1/auth/totp:
    post:
      tags: [auth]
      operationId: verifyTOTP
      summary: Complete the login with a TOTP code or a recovery code
      description: |
        Only in the login step "totp". On success the session is fully authenticated and its
        token is replaced (new cookie). Each code is accepted once; recovery codes are single-use.
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPRequest" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400":
          description: "Neither or both of code and recoveryCode given (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401":
          description: "Wrong, expired or already used code (code: invalid_code), or no session (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "The session is not in the TOTP step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll:
    post:
      tags: [auth]
      operationId: startTOTPEnrollment
      summary: Start a TOTP enrollment
      description: |
        In the login step "totp_enroll", or voluntarily when logged in and not yet enrolled.
        Returns a new secret; it becomes active once confirmed with a code. The break-glass
        account cannot enroll here (it uses `dcdash totp enroll`).
      security:
        - { session: [], csrf: [] }
      responses:
        "200":
          description: The secret to add to an authenticator app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Break-glass account (code: forbidden)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "Already enrolled (code: already_enrolled) or wrong login step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/enroll/confirm:
    post:
      tags: [auth]
      operationId: confirmTOTPEnrollment
      summary: Confirm a TOTP enrollment with a code
      description: |
        Activates the secret and returns recovery codes, which are shown only once. In the login
        step "totp_enroll", the session becomes fully authenticated (new cookie).
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentResult" }
        "401":
          description: "Wrong code (code: invalid_code), or no session (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "409":
          description: "No enrollment started (code: no_enrollment), already enrolled (code: already_enrolled) or wrong login step (code: wrong_stage)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/totp/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes
      description: Requires a current TOTP code. The old recovery codes stop working.
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: The new recovery codes, shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401":
          description: "Wrong code (code: invalid_code), or not logged in (code: not_authenticated)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429":
          $ref: "#/components/responses/TooManyAttempts"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/me/preferences:
    get:
      tags: [me]
      operationId: getPreferences
      summary: Preferences of the logged-in user
      description: Defaults (browser language, system theme) if the user has not saved any.
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [me]
      operationId: setPreferences
      summary: Save the preferences of the logged-in user
      security:
        - { session: [], csrf: [] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: The saved preferences.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        "400":
          description: "Invalid value (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: queryAudit
      summary: Query the audit log
      description: |
        Returns audit entries, newest first. Requires the permission `system:core:audit:read`.
        For the next (older) page, pass `nextBefore` as `before`.
      parameters:
        - { name: actor, in: query, schema: { type: string }, description: "User name (exact, case-insensitive)." }
        - { name: action, in: query, schema: { type: string }, description: 'Action, exact or as a prefix ending with "*" (e.g. "auth.*").' }
        - { name: target, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [success, failure, denied] } }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: Inclusive. }
        - { name: until, in: query, schema: { type: string, format: date-time }, description: Exclusive. }
        - { name: before, in: query, schema: { type: integer, format: int64, minimum: 1 }, description: Only entries with a lower ID. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        "200":
          description: Matching entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400":
          description: "Invalid filter (code: invalid_request)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/sessions:
    get:
      tags: [admin]
      operationId: listSessions
      summary: List active sessions
      description: Requires `system:core:sessions:read`. Newest first; tokens are never returned.
      parameters:
        - { name: username, in: query, schema: { type: string }, description: Only sessions of this user (case-insensitive). }
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/sessions/{id}:
    delete:
      tags: [admin]
      operationId: terminateSession
      summary: Terminate a session
      description: Requires `system:core:sessions:write`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Terminated.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "No such session (code: not_found)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{username}/sessions:
    delete:
      tags: [admin]
      operationId: terminateUserSessions
      summary: Terminate all sessions of a user
      description: Requires `system:core:sessions:write`.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Number of terminated sessions.
          content:
            application/json:
              schema:
                type: object
                required: [terminated]
                properties:
                  terminated: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default:
          $ref: "#/components/responses/Error"

  /api/v1/admin/users/{username}/totp:
    delete:
      tags: [admin]
      operationId: resetTOTP
      summary: Reset the TOTP enrollment of a user
      description: |
        Only for root. Removes the user's TOTP secret and recovery codes; directory users enroll
        again at their next login.
      security:
        - { session: [], csrf: [] }
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Reset.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "The user has no TOTP enrolled (code: not_found)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-dcdash_session
      description: Session cookie, set by login.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        The csrfToken of the session (returned by login and GET /api/v1/auth/me). Required for
        all state-changing requests of a session.

  responses:
    TooManyAttempts:
      description: "Too many failed attempts (code: too_many_attempts)."
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Unauthorized:
      description: "Not logged in (code: not_authenticated)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Forbidden:
      description: "Permission denied (code: forbidden)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    Error:
      description: Error response.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, maxLength: 256 }
        password: { type: string, format: password }

    SessionInfo:
      type: object
      required: [user, stage, csrfToken, expiresAt, roles, permissions, totp]
      properties:
        user: { $ref: "#/components/schemas/UserInfo" }
        stage:
          type: string
          enum: [authenticated, totp, totp_enroll]
          description: |
            authenticated: fully logged in; totp: a TOTP or recovery code is still required;
            totp_enroll: the user must enroll TOTP first. Pending steps expire after 10 minutes.
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time, description: Absolute end of the session. }
        roles:
          type: array
          items: { type: string }
          description: Roles of the user; empty until all login steps are completed.
        permissions:
          type: array
          items: { type: string }
          description: |
            Granted permissions (module:instance:resource:action); empty until all login steps
            are completed. The frontend uses them to hide what the user cannot use; the backend
            checks every request.
        totp: { $ref: "#/components/schemas/TOTPInfo" }

    TOTPInfo:
      type: object
      required: [enrolled, required, recoveryCodesRemaining]
      properties:
        enrolled: { type: boolean }
        required: { type: boolean, description: A role of the user requires TOTP (always for root and the break-glass account). }
        recoveryCodesRemaining: { type: integer }

    TOTPRequest:
      type: object
      description: Exactly one of code and recoveryCode.
      additionalProperties: false
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
        recoveryCode: { type: string, examples: ["k7m2-x9pq-4hvt-c3wn"] }

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    EnrollmentInfo:
      type: object
      required: [secret, uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        uri: { type: string, description: "otpauth:// URI, to be shown as QR code." }

    EnrollmentResult:
      type: object
      required: [recoveryCodes, session]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
        session: { $ref: "#/components/schemas/SessionInfo" }

    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionSummary" }

    SessionSummary:
      type: object
      required: [id, username, displayName, source, stage, createdAt, lastSeenAt, expiresAt, remoteAddr, userAgent, current]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [ldap, local] }
        stage: { type: string, enum: [authenticated, totp, totp_enroll] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        remoteAddr: { type: string }
        userAgent: { type: string }
        current: { type: boolean, description: The session of the request. }

    Preferences:
      type: object
      required: [language, theme]
      additionalProperties: false
      properties:
        language:
          type: string
          enum: ["", en, de]
          description: Empty means the browser language.
        theme:
          type: string
          enum: [system, light, dark]

    UserInfo:
      type: object
      required: [username, displayName, source, groups]
      properties:
        username: { type: string }
        displayName: { type: string }
        source: { type: string, enum: [ldap, local] }
        groups:
          type: array
          items: { $ref: "#/components/schemas/GroupInfo" }

    GroupInfo:
      type: object
      required: [dn, name]
      properties:
        dn: { type: string }
        name: { type: string }

    AuditPage:
      type: object
      required: [entries, nextBefore]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        nextBefore:
          type: [integer, "null"]
          format: int64
          description: Value of "before" for the next page; null on the last page.

    AuditEntry:
      type: object
      required: [id, time, actor, actorSource, clientIp, action, target, result, details, requestId]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        actor: { type: string, description: "User name; for failed logins the name that was given." }
        actorSource: { type: string, enum: [ldap, local, cli, system, anonymous] }
        clientIp: { type: string }
        action: { type: string, examples: [auth.login, authz.denied] }
        target: { type: string, description: The object acted on (may be empty). }
        result: { type: string, enum: [success, failure, denied] }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }

    StatusReport:
      type: object
      required: [components, checkedAt]
      properties:
        components:
          type: array
          items: { $ref: "#/components/schemas/StatusComponent" }
        checkedAt: { type: string, format: date-time }

    StatusComponent:
      type: object
      required: [name, kind, status, detail, latencyMs]
      properties:
        name: { type: string, examples: [database, directory, certificate] }
        kind:
          type: string
          description: '"system" for dcdash itself, otherwise the module (proxmox, dns, dhcp).'
        status: { type: string, enum: [ok, error] }
        detail: { type: string, description: A detail such as "valid until ..." or the error message. }
        latencyMs: { type: integer, format: int64 }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: 'Result per check: "ok", a detail such as "valid until <time>", or "error: <message>".'
          additionalProperties: { type: string }

    VersionInfo:
      type: object
      required: [version, commit, date, goVersion]
      properties:
        version: { type: string, examples: ["v0.1.0"] }
        commit: { type: string }
        date: { type: string, description: Build date (RFC 3339) or "unknown" }
        goVersion: { type: string, examples: ["go1.27.4"] }

    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [not_found]
            message:
              type: string
              description: English fallback message.
