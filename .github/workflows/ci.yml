name: CI

on:
  push:
    branches: [main, "sprint/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Read golangci-lint version
        id: lint
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint.outputs.version }}
      - name: Test
        run: go test -race ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - name: Install rndc
        run: sudo apt-get update -q && sudo apt-get install -y -q bind9-utils
      - name: Run integration tests
        run: scripts/integration-test.sh

  web:
    name: Frontend lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Lint, format and translation check
        run: npm run check
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Build
        run: npm run build-only
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: internal/ui/dist
          retention-days: 3

  build:
    name: Build binary
    needs: [go, integration, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for git describe
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: internal/ui/dist
      - name: Build
        run: make build-go
      - name: Smoke test
        run: ./bin/dcdash version
      - uses: actions/upload-artifact@v7
        with:
          name: dcdash-linux-amd64
          path: bin/dcdash
          retention-days: 7

  e2e:
    name: End-to-end tests
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: web
      - name: Install browser
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - name: Start test directory
        run: docker compose -f test/integration/compose.yaml up -d --build --wait openldap
      - name: Build
        run: make build
      - name: Run end-to-end tests
        run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: |
            .e2e/test-results/
            .e2e/screenshots/
          retention-days: 7
